<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#140E0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="동물의 왕국 — 계급 카드게임">
<link rel="icon" href="assets/card_01.webp">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>동물의 왕국 : 계급 카드게임</title>
<link id="webfonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Playfair+Display:wght@700&display=swap">
<style>
:root{
  --card-ink:#3B2A12; --card-ink-2:#5A431C;
  --gold:#C79A3E; --gold-hi:#F0D18C; --gold-dim:#8A6A24;
  --parchment:#F2E2BE; --parchment-dim:#C9B58C;
  --p1:#D6C097; --p2:#C4AA7B; --p3:#AE9362;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0B0803;color:var(--parchment);
  font-family:"Gowun Dodum",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

/* ---------- 배경 ---------- */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.bg__img{position:absolute;inset:-3%;background:url("assets/bg.webp") center/cover no-repeat}
@media (prefers-reduced-motion:no-preference){
  .bg__img{animation:drift 34s ease-in-out infinite alternate}
  @keyframes drift{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.1) translate(-1.4%,-1.6%)}}
}
.bg__top{position:absolute;left:0;right:0;top:0;height:34%;
  background:linear-gradient(180deg,rgba(6,4,2,.7),rgba(6,4,2,.28) 58%,transparent)}
.bg__bot{position:absolute;left:0;right:0;bottom:0;height:34%;
  background:linear-gradient(180deg,transparent,rgba(8,5,2,.5) 52%,rgba(6,4,2,.88) 86%,#0B0803)}
.motes{position:absolute;inset:0;pointer-events:none}
.mote{position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(255,232,178,.95),rgba(220,170,80,0) 68%)}
@media (prefers-reduced-motion:no-preference){
  .mote{animation:rise linear infinite}
  @keyframes rise{
    from{transform:translate3d(0,0,0);opacity:0}
    14%{opacity:.9}86%{opacity:.6}
    to{transform:translate3d(18px,-92vh,0);opacity:0}}
}

/* ---------- 화면 ---------- */
.screen{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 22px)}
.lang{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:16px;z-index:20;
  display:flex;border:1px solid rgba(199,154,62,.66);border-radius:2px;overflow:hidden;
  background:rgba(10,7,3,.5);backdrop-filter:blur(4px)}
.lang button{padding:6px 11px;font-size:11.5px;letter-spacing:.08em;color:var(--parchment-dim)}
.lang button[aria-pressed="true"]{color:#140D04;background:linear-gradient(180deg,var(--gold-hi),var(--gold))}

.spacer{flex:1;min-height:0}

/* ---------- 아래 부채꼴 ---------- */
.fan{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;z-index:3}
.fan__in{position:absolute;left:63%;top:55%;transform:translate(-50%,-50%);width:0;height:0}
.fan .card{position:absolute;transform-origin:50% 168%;box-shadow:0 16px 32px rgba(0,0,0,.8)}
.fan .card[data-i="0"]{transform:rotate(-21deg);filter:brightness(.8) saturate(.94);z-index:1}
.fan .card[data-i="1"]{transform:rotate(-10.5deg);filter:brightness(.92);z-index:2}
.fan .card[data-i="2"]{transform:translateY(-10px) scale(1.07);z-index:5}
.fan .card[data-i="3"]{transform:rotate(10.5deg);filter:brightness(.92);z-index:4}
.fan .card[data-i="4"]{transform:rotate(21deg);filter:brightness(.8) saturate(.94);z-index:3}

.card{--w:80px;width:var(--w);aspect-ratio:200/390;flex:none;
  border-radius:calc(var(--w) * .05);padding:calc(var(--w) * .042);
  background:
    radial-gradient(38% 22% at 16% 12%,rgba(140,106,52,.16),transparent 70%),
    radial-gradient(44% 24% at 70% 92%,rgba(112,82,38,.18),transparent 74%),
    repeating-linear-gradient(96deg,rgba(96,70,32,.045) 0 1px,transparent 1px 4px),
    linear-gradient(162deg,var(--p1),var(--p2) 52%,var(--p3));
  box-shadow:inset 0 0 calc(var(--w) * .09) rgba(108,78,34,.34);
  display:flex;flex-direction:column}
.card__band{display:flex;align-items:center;justify-content:space-between;
  padding:0 calc(var(--w) * .016);height:calc(var(--w) * .208);color:var(--card-ink)}
.card__num{font-family:"Noto Serif KR",serif;font-weight:900;font-size:calc(var(--w) * .152);
  line-height:1;min-width:calc(var(--w) * .145);text-align:center}
.card__name{font-family:"Noto Serif KR",serif;font-weight:700;font-size:calc(var(--w) * .086);
  letter-spacing:.03em;white-space:nowrap;color:var(--card-ink-2)}
body[data-lang="en"] .card__name{font-size:calc(var(--w) * .073);letter-spacing:.01em}
.card.is-joker .card__band{justify-content:center}
.card__mark{font-family:"Noto Serif KR",serif;font-weight:600;font-size:calc(var(--w) * .072);
  letter-spacing:.24em;text-indent:.24em;color:var(--card-ink-2)}
.card__art{flex:1;min-height:0;position:relative;
  border:calc(var(--w) * .011) solid var(--gold-dim);background:#1A1410;overflow:hidden}
.card__art img{width:100%;height:100%;object-fit:cover;display:block}
.card__art::after{content:"";position:absolute;inset:0;
  box-shadow:inset 0 0 0 calc(var(--w) * .011) rgba(240,209,140,.4)}
.plate{position:absolute;left:20px;right:20px;top:19.5%;z-index:3;
  text-align:center;text-shadow:0 3px 16px rgba(0,0,0,.92),0 1px 4px rgba(0,0,0,.85)}
.plate::before{content:"";position:absolute;left:-14%;right:-14%;top:-34px;bottom:-26px;
  z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side,rgba(6,4,2,.72),rgba(6,4,2,.34) 58%,transparent 100%)}
.eyebrow{font-family:"Noto Serif KR",serif;font-weight:600;font-size:12.5px;
  letter-spacing:.34em;text-indent:.34em;color:#E9BE63}
.wordmark{font-family:"Gowun Batang",serif;font-weight:700;
  font-size:clamp(33px,9.4vw,42px);line-height:1.16;margin:13px 0 10px}
body[data-lang="en"] .wordmark{font-family:"Playfair Display",serif;font-size:clamp(35px,10vw,45px)}
.sub{font-size:14px;color:#DCC69C;letter-spacing:.06em}
.hr{height:1px;margin:17px 52px 0;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
.btn{width:100%;padding:16px;border-radius:2px;
  background:linear-gradient(180deg,#8A2A28,#4E1614);border:1px solid var(--gold);
  color:var(--parchment);font-family:"Gowun Batang",serif;font-weight:700;
  font-size:17px;letter-spacing:.08em;
  box-shadow:0 1px 0 rgba(240,209,140,.3) inset,0 8px 24px rgba(0,0,0,.66)}
body[data-lang="en"] .btn{font-family:"Playfair Display",serif}
.btn:active{transform:translateY(1px)}

@media (prefers-reduced-motion:no-preference){
  .fan .card{animation:deal .6s cubic-bezier(.2,.7,.3,1) both}
  .fan .card[data-i="0"]{animation-delay:.5s}
  .fan .card[data-i="4"]{animation-delay:.57s}
  .fan .card[data-i="1"]{animation-delay:.64s}
  .fan .card[data-i="3"]{animation-delay:.71s}
  .fan .card[data-i="2"]{animation-delay:.8s}
  @keyframes deal{from{opacity:0;transform:translateY(34px) rotate(0deg) scale(.9)}}
  .plate>*{animation:rise2 .7s ease both}
  .eyebrow{animation-delay:.15s}
  .wordmark{animation-delay:.28s}
  .sub{animation-delay:.4s}
  .hr{animation-delay:.5s}
  .btn{animation:rise2 .6s ease both;animation-delay:.62s}
  @keyframes rise2{from{opacity:0;transform:translateY(12px)}}
}

/* ---------- 폰 비율 틀 ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:#0A0705}
@media (min-width:560px){
  html,body{background:#0A0705}
  #stage{
    inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);
    height:min(100dvh,940px);
    width:min(100vw,calc(min(100dvh,940px) / 2.08));
    border-radius:16px;
    box-shadow:0 0 0 1px rgba(198,154,62,.28),0 30px 80px rgba(0,0,0,.7);
  }
}
#stage .bg,#stage .sheet,#stage #flash{position:absolute}
/* 진입창 토글만 떠 있고 나머지 화면 토글은 제자리에 */
#lobby .lang,#room .lang,#draw .lang,#tax .lang,#table .lang{position:static;top:auto;right:auto}

/* ---------- 설정 버튼 ---------- */
.cfgbtn{display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:30px;height:30px;border:1px solid rgba(198,154,62,.6);border-radius:3px;
  background:rgba(10,7,3,.45);color:#D9C08A;cursor:pointer;padding:0}
.cfgbtn:active{transform:translateY(1px)}
#entry .cfgbtn{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:16px;z-index:20;
  backdrop-filter:blur(4px)}

/* ---------- 설정 창 ---------- */
.cfg{position:absolute;inset:0;z-index:60;visibility:hidden;
  display:flex;flex-direction:column;justify-content:flex-end}
.cfg.on{visibility:visible}
.cfg__v{position:absolute;inset:0;background:rgba(4,7,5,.72);opacity:0;transition:opacity .24s ease}
.cfg.on .cfg__v{opacity:1}
.cfg__p{position:relative;background:linear-gradient(180deg,#1A130C,#0E0A06);
  border-top:1px solid var(--gold,#B08A34);border-radius:12px 12px 0 0;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.3,1);
  padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}
.cfg.on .cfg__p{transform:none}
.cfg__h{display:flex;align-items:center;justify-content:space-between;
  padding:15px 18px 12px;border-bottom:1px solid #2E2417;
  font-family:"Gowun Batang",serif;font-weight:700;font-size:16px;color:#E9D5AC}
.cfg__x{font-size:21px;line-height:1;color:#B8A47E;background:none;border:none;cursor:pointer;padding:0 4px}
.cfg__b{padding:16px 18px 22px}
.cfg__l{font-size:11px;letter-spacing:.22em;color:#B08A34;margin-bottom:9px}
.cfg__row{display:flex;gap:8px}
.cfg__row button{flex:1;padding:13px;border:1px solid #4A3A1E;border-radius:3px;
  background:rgba(0,0,0,.3);color:#C9B58C;font-size:14px;cursor:pointer}
.cfg__row button[aria-pressed="true"]{color:#140D04;border-color:#E3C67C;
  background:linear-gradient(180deg,#E3C67C,#B08A34)}
.cfg__n{font-size:11.5px;color:#8E8064;line-height:1.6;margin-top:12px}
.page{display:none}
.page.is-on{display:block}
#entry{position:absolute;inset:0;overflow:hidden}
#lobby,#room,#draw,#tax,#table,#result{position:absolute;inset:0;z-index:30;overflow:hidden}
.navback{font-size:19px;line-height:1;color:#B8A47E;padding:2px 6px;background:none;border:none;cursor:pointer}

#lobby{
  --ink:#140E0A;
  --card-ink:#3B2A12;
  --card-ink-2:#5A431C;
  --gold:#B08A34;
  --gold-hi:#E3C67C;
  --gold-dim:#7A5E24;
  --parchment:#E9D5AC;
  --parchment-dim:#B8A47E;
  --p1:#D6C097; --p2:#C4AA7B; --p3:#AE9362;
}
*{box-sizing:border-box;margin:0;padding:0}
#lobby, #lobby{height:100%}
#lobby{
  background:var(--ink) url(assets/throne.webp) center/cover no-repeat;
  color:var(--parchment);
  font-family:"Gowun Dodum",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
#lobby button, #lobby input{font:inherit;color:inherit;background:none;border:none}
#lobby button{cursor:pointer}
#lobby :focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

#lobby .screen{position:relative;z-index:1;
  height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 20px);
}

#lobby /* ---------- header ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
#lobby .mark{font-family:"Gowun Batang",serif;font-weight:700;font-size:17px;letter-spacing:.03em;
  text-shadow:0 2px 6px rgba(0,0,0,.9);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lobby body[data-lang="en"] .mark{font-family:"Playfair Display",serif;font-size:16px}
#lobby .lang{display:flex;flex:none;border:1px solid var(--gold-dim);border-radius:2px;overflow:hidden}
#lobby .lang button{padding:5px 10px;font-size:11px;letter-spacing:.08em;color:var(--parchment-dim)}
#lobby .lang button[aria-pressed="true"]{color:#120C07;background:linear-gradient(180deg,var(--gold-hi),var(--gold))}

#lobby /* ---------- body ---------- */
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:22px}
#lobby .block__label{text-shadow:0 1px 4px rgba(0,0,0,.9);
  font-family:"Noto Serif KR",serif;font-weight:600;
  font-size:11px;letter-spacing:.28em;text-indent:.28em;color:var(--gold);
  margin-bottom:9px;
}
#lobby .btn-primary{
  width:100%;padding:17px;border-radius:2px;
  background:linear-gradient(180deg,#7A2226,#4A1418);
  border:1px solid var(--gold);
  font-family:"Gowun Batang",serif;font-weight:700;font-size:18px;letter-spacing:.08em;
  box-shadow:0 1px 0 rgba(227,198,124,.26) inset,0 6px 18px rgba(0,0,0,.5);
}
#lobby .btn-second{
  width:100%;padding:15px;border-radius:2px;
  border:1px solid var(--gold);
  font-family:"Gowun Batang",serif;font-weight:700;font-size:16px;letter-spacing:.06em;
  color:var(--parchment);
  background:rgba(176,138,52,.07);
}
#lobby body[data-lang="en"] .btn-primary, #lobby body[data-lang="en"] .btn-second{font-family:"Playfair Display",serif;letter-spacing:.08em}
#lobby .btn-primary:active, #lobby .btn-second:active{transform:translateY(1px)}
#lobby .hint{font-size:12px;color:#B0A283;text-shadow:0 1px 4px rgba(0,0,0,.95);margin-top:8px;line-height:1.65}

#lobby .join{display:flex;gap:9px}
#lobby .join input{
  flex:1;min-width:0;padding:14px 15px;border-radius:2px;
  border:1px solid var(--gold-dim);background:rgba(0,0,0,.34);
  font-family:"Noto Serif KR",serif;font-weight:700;
  font-size:20px;letter-spacing:.42em;text-align:center;color:var(--parchment);
}
#lobby .join input::placeholder{color:#6E6046;font-weight:600}
#lobby .join button{
  padding:0 20px;border-radius:2px;border:1px solid var(--gold-dim);
  font-size:14px;letter-spacing:.05em;color:var(--parchment-dim);white-space:nowrap;
}
#lobby .btn-rules{
  width:100%;padding:13px;border-radius:2px;border:1px solid var(--gold-dim);
  font-size:14px;letter-spacing:.06em;color:var(--parchment-dim);
}

#lobby /* ---------- rules sheet ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;visibility:hidden}
#lobby .sheet.is-open{visibility:visible}
#lobby .sheet__veil{position:absolute;inset:0;background:rgba(6,4,2,.72);opacity:0;transition:opacity .28s ease}
#lobby .sheet.is-open .sheet__veil{opacity:1}
#lobby .sheet__panel{
  position:relative;max-height:90%;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#241811,#150E09);
  border-top:1px solid var(--gold);border-radius:10px 10px 0 0;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.3,1);
  padding-bottom:env(safe-area-inset-bottom);
}
#lobby .sheet.is-open .sheet__panel{transform:none}
#lobby .sheet__head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;border-bottom:1px solid #33261A;
}
#lobby .sheet__title{font-family:"Gowun Batang",serif;font-weight:700;font-size:17px}
#lobby body[data-lang="en"] .sheet__title{font-family:"Playfair Display",serif}
#lobby .sheet__close{font-size:22px;line-height:1;color:var(--parchment-dim);padding:0 4px}
#lobby .sheet__body{overflow-y:auto;padding:16px 20px 26px;-webkit-overflow-scrolling:touch}

#lobby .lead{font-size:13.5px;line-height:1.75;color:#C9B792;margin-bottom:18px}
#lobby .lead b{color:var(--gold-hi);font-weight:400}

#lobby /* rank grid */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 4px;margin-bottom:22px}
#lobby .cell{display:flex;flex-direction:column;align-items:center;gap:5px}
#lobby .cell__c{font-size:10px;color:#7C6C4E;line-height:1}

#lobby /* mini card */
.card{
  --w:100%;
  width:100%;
  aspect-ratio:200/390;
  border-radius:3px;
  padding:2px;
  background:
    radial-gradient(38% 22% at 16% 12%,rgba(140,106,52,.16),transparent 70%),
    radial-gradient(44% 24% at 70% 92%,rgba(112,82,38,.18),transparent 74%),
    linear-gradient(162deg,var(--p1),var(--p2) 52%,var(--p3));
  box-shadow:0 2px 5px rgba(0,0,0,.5);
  display:flex;flex-direction:column;
}
#lobby .card__band{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1px;height:12px;color:var(--card-ink);
}
#lobby .card__num{font-family:"Noto Serif KR",serif;font-weight:900;font-size:8.5px;line-height:1}
#lobby .card__name{
  font-family:"Noto Serif KR",serif;font-weight:700;
  font-size:7px;line-height:1;letter-spacing:-.01em;
  color:var(--card-ink-2);white-space:nowrap;
}
#lobby body[data-lang="en"] .card__name{font-size:5.4px;letter-spacing:.01em}
#lobby .card__art{
  flex:1;min-height:0;position:relative;
  border:1px solid var(--gold-dim);background:#1A1410;overflow:hidden;
}
#lobby .card__art img{width:100%;height:100%;object-fit:cover;display:block}

#lobby /* rules text */
.rule{margin-bottom:16px}
#lobby .rule--joker{display:flex;gap:13px;align-items:flex-start}
#lobby .rule--joker .jk{width:calc((100% - 20px) / 6);flex:none}
#lobby .rule h3{font-family:"Gowun Batang",serif;font-weight:700;font-size:14px;color:var(--gold-hi);margin-bottom:5px}
#lobby body[data-lang="en"] .rule h3{font-family:"Playfair Display",serif}
#lobby .rule p{font-size:13px;line-height:1.75;color:#B7A683}
#lobby .rule p b{color:var(--gold-hi);font-weight:400}

#lobby .veil{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,5,2,.3),rgba(8,5,2,.52) 42%,rgba(6,4,2,.78))}


#draw{
  --card-ink:#3B2A12; --card-ink-2:#5A431C;
  --gold:#B08A34; --gold-hi:#E3C67C; --gold-dim:#7A5E24;
  --parchment:#E9D5AC; --parchment-dim:#B8A47E;
  --p1:#D6C097; --p2:#C4AA7B; --p3:#AE9362;
}
*{box-sizing:border-box;margin:0;padding:0}
#draw, #draw{height:100%}
#draw{background:#0B140F url(assets/tablebg.webp) center/cover no-repeat;
  color:var(--parchment);font-family:"Gowun Dodum",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
#draw button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
#draw :focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
#draw .screen{height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px)}

#draw .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
#draw .bar__t{font-family:"Gowun Batang",serif;font-weight:700;font-size:13.5px;color:#CFE0D4}
#draw .lang{display:flex;border:1px solid var(--gold-dim);border-radius:2px;overflow:hidden}
#draw .lang button{padding:4px 8px;font-size:10px;color:var(--parchment-dim)}
#draw .lang button[aria-pressed="true"]{color:#120C07;background:linear-gradient(180deg,var(--gold-hi),var(--gold))}

#draw .ring{height:66%;flex:none;position:static;margin-top:4px}
#draw .plane{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
#draw .pad{flex:1;min-height:0}
#draw .felt{display:none}
#draw .seat{--av:42px;--fs:10.5px;position:absolute;width:calc(var(--av,44px) + 32px);transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;z-index:6}

#table .screen{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;

#table .bar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:0 4px}

#table /* 바닥 펼치기 */
.spread{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);

  display:flex;flex-direction:column;gap:7px;align-items:stretch;
  padding:12px 11px;border-radius:6px;

  box-shadow:0 12px 30px rgba(0,0,0,.6)}
#table .srow{display:flex;align-items:center;gap:8px}
#table .srow__w{font-size:10px;color:#9FB6A5;width:34px;flex:none;text-align:right;white-space:nowrap}
#table .srow__c{display:flex;gap:3px;align-items:center}
#table .srow__p{font-size:10px;color:#9FB6A5;padding-left:3px}
#table .srow--new .srow__w{color:var(--gold-hi)}
#table .srow--new .srow__c{outline:1px solid rgba(227,198,124,.5);outline-offset:3px;border-radius:3px}
#table .spread__t{font-size:10.5px;color:#7E9686;text-align:center;padding-top:2px}
#table .play, #table .pile__hint, #table .spread{pointer-events:auto;cursor:pointer}

#table /* ---------- ring ---------- */
.ring{flex:1;min-height:0;position:static;margin-top:4px}
#table .stage{position:absolute;inset:0}
#table .plane{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.3,.7,.3,1)}
#table .felt{display:none}   #table /* 바닥은 배경 그림이 대신한다 */

.seat{--av:44px;--fs:10.5px;position:absolute;width:calc(var(--av,44px) + 32px);
  display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;z-index:6;
  transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
#table .seat{transform:translate(-50%,-50%)}
#table .seat__av{width:var(--av,44px);height:var(--av,44px);border-radius:50%;object-fit:cover;
  border:2px solid rgba(198,154,60,.6);background:#241A12;box-shadow:0 3px 9px rgba(0,0,0,.6)}

#table .seat--me .seat__av{border-color:#E3C67C;width:calc(var(--av,44px) + 4px);height:calc(var(--av,44px) + 4px)}
#table .seat__n{font-size:var(--fs,10.5px);text-shadow:0 1px 3px rgba(0,0,0,.9);line-height:1.2;white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis}
#table .seat__c{font-size:calc(var(--fs,10.5px) - 1px);color:#CFE0D4;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap}

#table .fan{position:relative;height:22px;margin-top:1px}
#table .fan i{
  position:absolute;top:0;width:13px;height:22px;border-radius:2px;

  border:.5px solid rgba(198,154,60,.55);
  box-shadow:-1px 1px 3px rgba(0,0,0,.6);
}
#table .seat__tag{position:absolute;top:-7px;left:50%;transform:translateX(-50%);

  background:rgba(10,16,12,.92);border:1px solid var(--gold-dim);color:var(--gold-hi);white-space:nowrap}

#table /* ---------- pile in the middle ---------- */
.pile{position:absolute;left:49%;top:43%;width:0;height:0;z-index:4;transform-style:preserve-3d}
#table #seats{position:absolute;inset:0;transform-style:preserve-3d}
#table .play{position:absolute;left:0;top:0;display:flex;gap:4px;transform-style:preserve-3d;
  transform:translate(-50%,calc(-50% + var(--dy,0px))) rotate(var(--r,0deg)) scale(var(--sc,1))}
#table .play--new{animation:toss .34s cubic-bezier(.2,.8,.3,1) both}
@keyframes toss{
  from{transform:translate(calc(-50% + var(--fx,0px)),calc(-50% + var(--fy,0px))) rotate(0deg) scale(.72);opacity:.2}
}
#table .play--old{filter:brightness(.5) saturate(.7)}

#table .pile__hint{position:absolute;left:49%;top:43%;transform:translate(-50%,-50%);backface-visibility:hidden;

#table /* ---------- card ---------- */
.card{--w:58px;width:var(--w);aspect-ratio:200/390;flex:none;
  border-radius:calc(var(--w) * .05);padding:calc(var(--w) * .042);

  display:flex;flex-direction:column}
#table .card__band{display:flex;align-items:center;justify-content:space-between;

#table .card__num{font-family:"Noto Serif KR",serif;font-weight:900;font-size:calc(var(--w) * .152);
  line-height:1;min-width:calc(var(--w) * .145);text-align:center}
#table .card__name{font-family:"Noto Serif KR",serif;font-weight:700;font-size:calc(var(--w) * .086);
  white-space:nowrap;color:var(--card-ink-2)}
#table .card.is-joker .card__band{justify-content:space-between}
#table .card__num.as{color:#8A6A1E}
#table .card.is-joker .card__name{font-size:calc(var(--w) * .072)}
#table .card__art{flex:1;min-height:0;border:calc(var(--w) * .011) solid var(--gold-dim);
  background:#1A1410;overflow:hidden}
#table .card__art img{width:100%;height:100%;object-fit:cover;display:block}

#table /* ---------- hand ---------- */
.need{position:relative;z-index:5;text-align:center;font-size:11.5px;color:#CDE0D4;
  margin:2px auto 5px;min-height:16px;max-width:96%;padding:3px 10px;border-radius:10px;

#table .timer{height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:8px}
#table .timer i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-hi),var(--gold));
  transform-origin:left;animation:tick 15s linear forwards}
@keyframes tick{from{transform:scaleX(1)}to{transform:scaleX(0)}}
#table .hand{position:relative;z-index:2;height:126px;margin-bottom:9px}
#table .hand .slot{position:absolute;bottom:0;transition:transform .16s ease}
#table .hand .card{--w:60px}
#table .hand .card__name{display:none}
#table .slot--sel{transform:translateY(-20px)}

#table .slot--dead .card{filter:brightness(.44) saturate(.5)}
#table .acts{position:relative;z-index:2;display:flex;gap:9px}
#table .acts button{flex:1;padding:14px;border-radius:2px;
  font-family:"Gowun Batang",serif;font-weight:700;font-size:16px;letter-spacing:.05em}
#table .bt-pass{border:1px solid var(--gold-dim);color:var(--parchment-dim)}
#table .bt-play{background:linear-gradient(180deg,#7A2226,#4A1418);border:1px solid var(--gold);
  box-shadow:0 1px 0 rgba(227,198,124,.24) inset,0 5px 14px rgba(0,0,0,.5)}
#table .acts button:disabled{opacity:.36;box-shadow:none}

</style>

(function(){

const document = {
  getElementById: id => __r.querySelector('[id="' + id + '"]'),
  querySelector: s => __r.querySelector(s),
  querySelectorAll: s => __r.querySelectorAll(s),
  createElement: t => window.document.createElement(t),
  get body(){ return window.document.body },
  get documentElement(){ return window.document.documentElement },
  addEventListener: (...a) => window.document.addEventListener(...a)
};

const ART = {"01": "assets/card_01.webp", "02": "assets/card_02.webp", "03": "assets/card_03.webp", "04": "assets/card_04.webp", "05": "assets/card_05.webp", "06": "assets/card_06.webp", "07": "assets/card_07.webp", "08": "assets/card_08.webp", "09": "assets/card_09.webp", "10": "assets/card_10.webp", "11": "assets/card_11.webp", "12": "assets/card_12.webp", "jokerA": "assets/joker_a.webp", "jokerB": "assets/joker_b.webp", "back": "assets/back.webp"}, HEADS = ["assets/head_01.webp", "assets/head_02.webp", "assets/head_04.webp", "assets/head_10.webp", "assets/head_06.webp", "assets/head_09.webp", "assets/head_07.webp", "assets/head_12.webp"];
const el = id => document.getElementById(id);
const isJ = c => c >= 13;
const KO_N = ["사자","호랑이","불곰","코끼리","악어","여우","기린","멧돼지","원숭이","토끼","새","생쥐"];
const EN_N = ["LION","TIGER","BEAR","ELEPHANT","CROCODILE","FOX","GIRAFFE","BOAR","MONKEY","RABBIT","BIRD","MOUSE"];
const NAMES_KO = ["나","민지","준호","서연","태윤","하은","지훈","예린"];
const NAMES_EN = ["You","Minji","Junho","Seoyeon","Taeyun","Haeun","Jihoon","Yerin"];

const T = {
  ko:{ step:"첫 계급 정하기",
       h:"카드를 한 장 뽑으세요",
       s:"숫자가 가장 낮은 분이 먼저 시작합니다. 차례는 거기서 시계 방향으로 돕니다. 카멜레온은 13으로 칩니다.",
       waitH:"뽑는 중",
       waitS:n=>'<b>'+n+'</b>님이 고르고 있습니다.', settling:"뽑은 카드를 맞춰 보는 중입니다.",
       doneH:"순서가 정해졌습니다", first:"선",
       doneS:n=>'<b>'+n+'</b>님이 먼저 시작합니다. 차례는 여기서 시계 방향입니다.',
       note:"첫 판은 계급도 세금도 없습니다.",
       go:"판 시작", picking:"고르는 중" },
  en:{ step:"Opening draw",
       h:"Draw one card",
       s:"The lowest number leads. Turn order runs clockwise from that seat. A chameleon counts as 13.",
       waitH:"Drawing",
       waitS:n=>'<b>'+n+'</b> is choosing.', settling:"Comparing the draws.",
       doneH:"Turn order is set", first:"LEAD",
       doneS:n=>'<b>'+n+'</b> leads. Turns run clockwise from there.',
       note:"The first round has no ranks and no tax.",
       go:"Start round", picking:"Choosing" }
};
let lang = window.__lang || "ko";
let N = 6;
const nameOf = i => (lang === "ko" ? NAMES_KO : NAMES_EN)[i];
const art = n => n === 13 ? ART.jokerA : n === 14 ? ART.jokerB : ART[String(n).padStart(2,"0")];
const val = c => isJ(c) ? 13 : c;

let drawn = Array(N).fill(null);   // 자리별로 뽑은 카드
let pool = [];                     // 바닥에 깔린 카드
let waiting = [];                  // 아직 안 뽑은 자리 (순서대로)
let phase = "pick";                // pick | tie | done

const RING = {cx: 49, cy: 44, rx: 36, ry: 16};
function seatPos(i){
  const a = (Math.PI / 2) + (i * 2 * Math.PI / N);
  return {x: RING.cx + Math.cos(a) * -RING.rx, y: RING.cy + Math.sin(a) * RING.ry};
}
function cardFace(c){
  const n = isJ(c) ? 13 : c;
  return '<div class="card">' +
    '<div class="card__band"><span class="card__num">' + n + '</span>' +
    '<span class="card__num">' + n + '</span></div>' +
    '<div class="card__art"><img src="' + art(c) + '" alt=""></div>' +
    '<div class="card__band"><span class="card__num">' + n + '</span>' +
    '<span class="card__num">' + n + '</span></div></div>';
}
function makeDeck(){
  const d = [];
  for (let n = 1; n <= 12; n++) for (let i = 0; i < n; i++) d.push(n);
  d.push(13, 14);
  for (let i = d.length - 1; i > 0; i--){
    const k = Math.floor(Math.random() * (i + 1));
    [d[i], d[k]] = [d[k], d[i]];
  }
  return d;
}

/* 가장 낮은 숫자를 뽑은 사람이 1등. 나머지는 그 자리에서 시계 방향으로 */
let pickOrder = [];              // 뽑은 순서 (동점이면 먼저 뽑은 쪽이 위)
function winner(){
  let best = null;
  pickOrder.forEach(i => {
    if (drawn[i] == null) return;
    if (best === null || val(drawn[i]) < val(drawn[best])) best = i;
  });
  return best === null ? 0 : best;
}
function ranking(){
  const w = winner();
  return Array.from({length: N}, (_, k) => ({i: (w + k) % N}));
}

function layout(players){
  const d = makeDeck();
  pool = d.slice(0, players.length);
  waiting = players.slice();
  const deck = el("deck");
  deck.innerHTML = "";
  const n = pool.length;
  const cols = n <= 4 ? n : Math.min(4, Math.ceil(n / 2));
  const avail = (el("ring").clientWidth || 360) - 48;
  const pw = Math.max(26, Math.min(34, Math.floor((avail - (cols - 1) * 9) / cols)));
  deck.style.setProperty("--cols", cols);
  deck.style.setProperty("--pw", pw + "px");
  pool.forEach((c, k) => {
    const w = document.createElement("div");
    w.className = "pk";
    w.dataset.k = k;
    w.innerHTML = '<div class="pk__in">' +
      '<div class="pk__f pk__f--b"><img src="' + ART.back + '" alt=""></div>' +
      '<div class="pk__f pk__f--a">' + cardFace(c) + '</div></div>';
    w.onclick = () => { if (waiting[0] === 0) pick(0, k); };
    deck.appendChild(w);
  });
}

function pick(seat, k){
  const w = el("deck").querySelector('.pk[data-k="' + k + '"]:not(.taken)');
  if (!w) return;
  drawn[seat] = pool[k];
  pickOrder.push(seat);
  waiting = waiting.filter(x => x !== seat);
  w.classList.add("flip", "taken");
  w.dataset.seat = seat;
  draw();
  if (waiting.length) setTimeout(botPick, 900);
  else setTimeout(settle, 1200);
}

function botPick(){
  const seat = waiting[0];
  const free = pool.map((_, k) => k).filter(k =>
    el("deck").querySelector('.pk[data-k="' + k + '"]:not(.taken)'));
  pick(seat, free[Math.floor(Math.random() * free.length)]);
}

function settle(){
  phase = "done";
  const w = winner();
  window.GAME = window.GAME || {};
  window.GAME.N = N;
  window.GAME.roundNo = 1;
  window.GAME.score = Array(N).fill(0);
  window.GAME.order = Array.from({length: N}, (_, k) => (w + k) % N);  // 선부터 시계 방향
  window.GAME.finish = null;
  window.GAME.hold = null;
  draw();
}

function renderSeats(){
  const box = el("seats"); box.innerHTML = "";
  const order = phase === "done" ? ranking().map(x => x.i) : [];
  for (let i = 0; i < N; i++){
    const p = seatPos(i);
    const d = document.createElement("div");
    const r = order.indexOf(i);
    d.className = "seat" + (i === 0 ? " seat--me" : "") +
      (waiting[0] === i && phase === "pick" ? " seat--turn" : "") +
      "";
    d.style.left = p.x.toFixed(1) + "%"; d.style.top = p.y.toFixed(1) + "%";
    const big = N <= 6;
    d.style.setProperty("--av", (big ? 42 : 33) + "px");
    d.style.setProperty("--fs", (big ? 10.5 : 9) + "px");
    const first = phase === "done" && i === winner();
    const dv = drawn[i] == null ? "" : val(drawn[i]);
    d.innerHTML =
      '<span class="seat__r' + (first ? " on" : "") + '">' + T[lang].first + '</span>' +
      '<img class="seat__av" src="' + HEADS[i] + '" alt="">' +
      '<span class="seat__n">' + nameOf(i) + '</span>' +
      (dv === "" ? "" : '<span class="seat__d">' + dv + '</span>');
    box.appendChild(d);
  }
}

function draw(){
  const t = T[lang];
  el("step").textContent = t.step;
  renderSeats();
  const m = el("mid");
  if (phase === "done"){
    m.innerHTML = '<div class="mid__h">' + t.doneH + '</div><div class="mid__s">' +
      t.doneS(nameOf(winner())) + '<br>' + t.note + '</div>';
  } else if (!waiting.length){
    m.innerHTML = '<div class="mid__h">' + t.waitH + '</div><div class="mid__s">' + t.settling + '</div>';
  } else if (waiting[0] === 0){
    m.innerHTML = '<div class="mid__h">' + t.h + '</div><div class="mid__s">' + t.s + '</div>';
  } else {
    m.innerHTML = '<div class="mid__h">' + t.waitH + '</div><div class="mid__s">' +
      t.waitS(nameOf(waiting[0])) + '</div>';
  }
  const g = el("go");
  g.textContent = phase === "done" ? t.go : t.picking;
  g.disabled = phase !== "done";
}

function boot(){
  N = (window.__opts && window.__opts.cap) || 6;
  drawn = Array(N).fill(null);
  pickOrder = [];
  window.__roundNo = 1;
  window.__myRankIdx = null;
  window.GAME = {N: N, roundNo: 1, score: Array(N).fill(0), order: null, finish: null, hold: null};
  phase = "pick";
  layout(Array.from({length: N}, (_, i) => i));
  draw();
}
window.__bootDraw = boot;
boot();

/* 등수 → 자리, 자리 → 등수 */
function order(){ return reversed ? ranks.slice().reverse() : ranks; }
function rankOf(seat){ return order().indexOf(seat); }
/* 계급 호칭 = 덱 순서. 위에서부터 사자·호랑이·…, 아래에서부터 생쥐·새·… */
function ordEn(n){
  const s = ["th","st","nd","rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function rankLabel(r){ return lang === "ko" ? (r + 1) + "등" : ordEn(r + 1); }

const RING = {cx: 49, cy: 44, rx: 36, ry: 16};
function seatPos(i){
  const a = (Math.PI / 2) + (i * 2 * Math.PI / N);
  return {x: RING.cx + Math.cos(a) * -RING.rx, y: RING.cy + Math.sin(a) * RING.ry};
}

/* from/to: 자리 번호, -1이면 가운데 */
function flyCard(from, to, card, delay, faceDown){
  const a = from < 0 ? {x:50,y:50} : seatPos(from);
  const b = to   < 0 ? {x:50,y:50} : seatPos(to);
  const d = document.createElement("div");
  d.className = "fly";
  d.style.left = a.x + "%"; d.style.top = a.y + "%";
  d.style.transform = "translate(-50%,-50%) scale(.7)";
  d.style.opacity = 0;
  d.innerHTML = faceDown ? backHTML(32) : cardHTML(card, 32);
  el("fx").appendChild(d);
  setTimeout(() => {
    d.style.opacity = 1;
    d.style.left = b.x + "%"; d.style.top = b.y + "%";
    d.style.transform = "translate(-50%,-50%) scale(1) rotate(" + (Math.random()*20-10).toFixed(0) + "deg)";
  }, delay + 20);
  setTimeout(() => { d.style.opacity = 0; }, delay + 620);
  setTimeout(() => d.remove(), delay + 950);
}
function backHTML(w){
  return '<div class="card" style="--w:' + w + 'px;padding:2px"><div class="card__art" style="border-width:1px">' +
    '<img src="' + ART.back + '" alt=""></div></div>';
}
function clearFx(){ el("fx").innerHTML = ""; }

function dealAll(){
  const d = [];
  for (let n = 1; n <= 12; n++) for (let i = 0; i < n; i++) d.push(n);
  d.push(13, 14);
  for (let i = d.length - 1; i > 0; i--){
    const k = Math.floor(Math.random() * (i + 1));
    [d[i], d[k]] = [d[k], d[i]];
  }
  const hands = Array.from({length: N}, () => []);
  d.forEach((c, i) => hands[i % N].push(c));
  hands.forEach(x => x.sort((a, b) => a - b));
  G().hold = hands;
  const w = hands.findIndex(x => x.filter(c => c >= 13).length === 2);
  revSeat = w < 0 ? null : w;
}

/* 세금을 실제 손패에 적용 */
function applyTax(myGive){
  const hh = holds(), o = order();
  [[o[0], o[N-1], 2], [o[1], o[N-2], 1]].forEach(([hi, lo, k]) => {
    const best = hh[lo].slice().sort((a, b) => a - b).slice(0, k);
    best.forEach(c => hh[lo].splice(hh[lo].indexOf(c), 1));
    const give = hi === 0 ? myGive.slice(0, k)
                          : hh[hi].slice().sort((a, b) => b - a).slice(0, k);
    give.forEach(c => hh[hi].splice(hh[hi].indexOf(c), 1));
    hh[hi].push(...best); hh[lo].push(...give);
    hh[hi].sort((a, b) => a - b); hh[lo].sort((a, b) => a - b);
  });
}

/* 새 패 나눠 주기 */
function runDeal(){
  clearFx();
  for (let round = 0; round < 3; round++)
    for (let i = 0; i < N; i++)
      flyCard(-1, i, 0, (round * 6 + i) * 55, true);
}

/* 세금 주고받기 */
function runTax(){
  window.__myGive = window.__myGive || [];
  clearFx();
  const o = order(), n = N;
  const pairs = [[o[0], o[n-1], 2], [o[1], o[n-2], 1]];
  let t = 0;
  pairs.forEach(([hi, lo, k]) => {
    /* 내가 낀 교환만 앞면. 남들끼리 주고받는 건 원래 안 보이는 정보라 뒷면 */
    const mine = hi === 0 || lo === 0;
    const best = holds()[lo].slice().sort((a, b) => a - b).slice(0, k);
    for (let j = 0; j < k; j++){ flyCard(lo, hi, best[j], t, !mine); t += 150; }
    for (let j = 0; j < k; j++){
      flyCard(hi, lo, hi === 0 ? window.__myGive[j] : 12, t, !mine); t += 150;
    }
  });
}

  for (let i = 0; i < N; i++){
    const p = seatPos(i), r = rankOf(i), n = N;
    const d = document.createElement("div");
    d.className = "seat" + (i === 0 ? " seat--me" : "") +
      (step >= 1 && r <= 1 ? " seat--top" : "") + (step >= 1 && r >= n - 2 ? " seat--bot" : "");
    d.style.left = p.x.toFixed(1) + "%"; d.style.top = p.y.toFixed(1) + "%";
    const big = N <= 6;
    d.style.setProperty("--av", (big ? 44 : 34) + "px");
    d.style.setProperty("--fs", (big ? 10.5 : 9) + "px");
    d.innerHTML =
      '<span class="seat__r' + (step >= 1 ? " on" : "") + '">' + rankLabel(r) + '</span>' +
      '<img class="seat__av" src="' + HEADS[i] + '" alt="">' +
      '<span class="seat__n">' + nameOf(i) + '</span>';
    box.appendChild(d);
  }
}

function renderHand(){
  const h = el("hand"); h.innerHTML = "";
  const hand = myHand(), w = 54, n = hand.length;
  const step2 = n > 1 ? Math.min(40, (h.clientWidth - w) / (n - 1)) : 0;
  const total = w + step2 * (n - 1);
  const taken = takenIdx();
  hand.forEach((c, i) => {
    const s = document.createElement("div");
    s.className = "slot" + (sel.includes(i) ? " slot--sel" : "") + (taken.includes(i) ? " slot--take" : "");
    s.style.left = ((h.clientWidth - total) / 2 + i * step2) + "px";
    s.style.zIndex = i;
    s.innerHTML = cardHTML(c, w);
    s.onclick = () => { if (!giveCount()) return;
      const k = sel.indexOf(i);
      if (k >= 0) sel.splice(k, 1);
      else if (sel.length < giveCount()) sel.push(i);
      draw(); };
    h.appendChild(s);
  });
}

/* 내가 세금으로 몇 장을 줘야 하나 */
function giveCount(){
  if (step !== 3 || taxSkipped()) return 0;
  const r = rankOf(0), n = N;
  return r === 0 ? 2 : r === 1 ? 1 : 0;
}
/* 내가 뺏기는 카드 (가장 좋은 = 숫자 작은 순) */
function takenIdx(){
  if (step !== 3 || taxSkipped()) return [];
  const r = rankOf(0), n = N;
  const k = r === n - 1 ? 2 : r === n - 2 ? 1 : 0;
  return myHand().map((c, i) => i).sort((a, b) => myHand()[a] - myHand()[b]).slice(0, k);
}
function taxSkipped(){ return revSeat !== null && declared; }

function renderMid(){
  const t = T[lang], m = el("mid"), r = rankOf(0), n = N, o = order();
  let html = "";
  if (step === 0){
    html = '<div class="mid__h">' + t.rankH + '</div><div class="mid__s">' + t.rankS + '</div>';
  } else if (step === 1){
    html = '<div class="mid__h">' + t.dealH + '</div><div class="mid__s">' + t.dealS + '</div>';
  } else if (step === 2){
    const great = revSeat !== null && rankOf(revSeat) === n - 1;
    html = '<div class="mid__h">' + t.revH + '</div><div class="mid__s">' +
      (revSeat === null ? t.revNone
       : declared ? (great ? t.revGreatDone : t.revDone)
       : revSeat === 0 ? (great ? t.revGreatMine : t.revMine)
       : t.revOther(nameOf(revSeat))) + '</div>';
    if (revSeat === 0 && !declared)
      html += '<div class="flow rev"><div class="frow"><span class="frow__c">' +
        cardHTML(13, 40) + cardHTML(14, 40) + '</span></div></div>';
  } else if (step === 3){
    html = '<div class="mid__h">' + t.taxH + '</div><div class="mid__s">' +
      (taxSkipped() ? t.taxSkip
       : r === 0 ? t.taxMineTop(nameOf(o[n-1]))
       : r === 1 ? t.taxMineTop2(nameOf(o[n-2]))
       : r === n-1 ? t.taxMineBot(nameOf(o[0]))
       : r === n-2 ? t.taxMineBot2(nameOf(o[1]))
       : t.taxMid) + '</div>';
    if (!taxSkipped()){
      /* 내가 받는 카드: 상대의 가장 좋은 카드 (실제 손패에서) */
      const partner = r === 0 ? o[n-1] : r === 1 ? o[n-2] : null;
      const inC = partner === null ? []
        : holds()[partner].slice().sort((a, b) => a - b).slice(0, r === 0 ? 2 : 1);
      const outC = takenIdx().map(i => myHand()[i]);
      let rows = "";
      if (inC.length) rows += '<div class="frow frow--in"><span class="frow__w">' +
        nameOf(partner) + ' \u2192</span><span class="frow__c">' +
        inC.map(c => cardHTML(c, 34)).join("") + '</span></div>';
      if (outC.length) rows += '<div class="frow frow--out"><span class="frow__w">\u2192 ' +
        nameOf(o[r === n-1 ? 0 : 1]) + '</span><span class="frow__c">' +
        outC.map(c => cardHTML(c, 34)).join("") + '</span></div>';
      if (sel.length) rows += '<div class="frow frow--out"><span class="frow__w">\u2192 ' +
        nameOf(partner) + '</span><span class="frow__c">' +
        sel.map(i => cardHTML(myHand()[i], 34)).join("") + '</span></div>';
      if (rows) html += '<div class="flow">' + rows + '</div>';
    }
  } else {
    html = '<div class="mid__h">' + t.doneH + '</div><div class="mid__s">' + t.doneS(nameOf(order()[0])) + '</div>';
  }
  m.innerHTML = html;
}

function renderBottom(){
  const t = T[lang], great = revSeat !== null && rankOf(revSeat) === N - 1;
  el("step").textContent = (step + 1) + ". " + t.steps[step];
  el("back").textContent = t.back;
  const g = giveCount();
  el("hint").innerHTML = step === 3 && g
    ? (sel.length < g ? t.giveNeed(g - sel.length) : "")
    : "";
  const b = el("next");
  if (step === 2 && revSeat === 0 && !declared){
    b.className = "bt-rev"; b.textContent = great ? t.declareG : t.declare; b.disabled = false;
  } else {
    b.className = "bt-main";
    b.textContent = step === 4 ? t.start : step === 3 && g ? t.give(g) : t.next;
    b.disabled = step === 3 && g > 0 && sel.length < g;
  }
}

function draw(){
  renderSeats(); renderMid(); renderHand(); renderBottom();
  if (step >= 1) window.__myRankIdx = rankOf(0);
}

function boot(){
  const g = G();
  N = g.N || 6;
  ranks = (g.finish && g.finish.length === N) ? g.finish.slice()
        : Array.from({length: N}, (_, i) => i);
  step = 0; sel = []; declared = false; reversed = false; revSeat = null;
  clearFx();
  draw();
}

el("next").onclick = () => {
  const great = revSeat !== null && rankOf(revSeat) === N - 1;
  if (step === 2 && revSeat !== null && !declared){
    declared = true;
    if (great){
      reversed = true;
      el("flash").classList.remove("go"); void el("flash").offsetWidth; el("flash").classList.add("go");
      draw();
      document.querySelectorAll(".seat__r").forEach(x => x.classList.add("swap"));
      setTimeout(() => document.querySelectorAll(".seat__r").forEach(x => x.classList.remove("swap")), 750);
      return;
    }
    draw(); return;
  }
  if (step === 3 && !taxSkipped()){
    window.__myGive = sel.map(i => myHand()[i]);
    runTax();
    applyTax(window.__myGive);
    sel = [];
  }
  if (step < 4) step++;
  if (step === 1){ dealAll(); }
  draw();
  if (step === 1) runDeal();
  if (step === 4) G().order = order().slice();
};
el("back").onclick = () => { if (window.__toResult) window.__toResult(); };

    document.querySelectorAll("#lang button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    draw();

    d.className = "seat" + (i === 0 ? " seat--me" : "") +
      (turn === i && !busy ? " seat--turn" : "") +
      (s.s === "pass" ? " seat--pass" : "") + (s.c === 0 ? " seat--out" : "");
    d.style.left = p.x.toFixed(1) + "%"; d.style.top = p.y.toFixed(1) + "%";
    const big = SEATS.length <= 6;
    d.style.setProperty("--av", (big ? 44 : 34) + "px");
    d.style.setProperty("--fs", (big ? 10.5 : 9) + "px");
    d.style.zIndex = 6 + Math.round(p.y);
    const tg = T[lang];
    const tag = s.c === 0 ? tg.tagOut : turn === i ? tg.tagTurn : s.s === "pass" ? tg.tagPass : "";
    d.innerHTML = (tag ? '<span class="seat__tag">' + tag + '</span>' : '') +
      '<img class="seat__av" src="' + HEADS[i] + '" alt="">' +
      '<span class="seat__n">' + (lang === "ko" ? ALL : ALL_EN)[i] + '</span>' +
      (i === 0 ? '' : fanHTML(s.c)) +
      '<span class="seat__c">' + T[lang].left(s.c) + '</span>';
    box.appendChild(d);
  });
}

function renderPile(){
  const p = el("pile"); p.innerHTML = "";
  if (spread && trick.length){
    const t = T[lang];
    const maxC = Math.min(6, Math.max(...trick.map(x => x.count)));
    const cw = Math.max(18, Math.min(32, Math.floor((196 - (maxC - 1) * 3) / maxC)));
    p.innerHTML = '<div class="spread">' + trick.slice().reverse().map((x, idx) =>
      '<div class="srow' + (idx === 0 ? ' srow--new' : '') + '">' +
        '<span class="srow__w">' + (lang === "ko" ? ALL : ALL_EN)[x.by] + '</span>' +
        '<span class="srow__c">' +
          (x.cards || Array.from({length: x.count}, () => x.num))
            .slice(0, 6).map(cc => cardHTML(cc, cw, isJ(cc) ? x.num : null)).join("") +
          (x.count > 6 ? '<span class="srow__p">+' + (x.count - 6) + '</span>' : '') +
        '</span>' +
      '</div>').join("") + '<div class="spread__t">' + t.close + '</div></div>';
    return;
  }
  if (!trick.length){
    p.innerHTML = '<div class="pile__hint">' + T[lang].emptyPile + '</div>';
    animated = 0;
    return;
  }
  const rect = el("ring").getBoundingClientRect();
  trick.slice(-4).forEach((t, kk) => {
    const k = trick.length - Math.min(trick.length, 4) + kk;
    const from = seatPos(t.by);
    const g = document.createElement("div");
    g.className = "play" + (k < trick.length - 1 ? " play--old" : "") +
      (k >= animated ? " play--new" : "");
    const d = trick.length - 1 - k;
    g.style.setProperty("--r", d === 0 ? "0deg" : (((k * 37) % 19) - 9 - d * 3) + "deg");
    g.style.setProperty("--dy", (-Math.min(d, 3) * 6) + "px");
    g.style.setProperty("--sc", (1 - Math.min(d, 3) * 0.05).toFixed(3));
    g.style.setProperty("--fx", ((from.x - 50) / 100 * rect.width).toFixed(0) + "px");
    g.style.setProperty("--fy", ((from.y - 50) / 100 * rect.height).toFixed(0) + "px");
    g.style.zIndex = k;
    const cw = Math.max(18, Math.min(44, Math.floor((rect.width * 0.44 - (t.count - 1) * 4) / t.count)));
    g.innerHTML = (t.cards || Array.from({length: t.count}, () => t.num))
      .map(cc => cardHTML(cc, cw, isJ(cc) ? t.num : null)).join("");
    p.appendChild(g);
  });
  animated = trick.length;
}

function renderHand(){
  const h = el("hand"); h.innerHTML = "";
  const w = 60, n = hand.length;
  const step = n > 1 ? Math.min(36, (h.clientWidth - w) / (n - 1)) : 0;
  const total = w + step * (n - 1);
  hand.forEach((c, i) => {
    const s = document.createElement("div");
    s.className = "slot" + (sel.includes(i) ? " slot--sel" : "") + (isDead(c) ? " slot--dead" : "");
    s.style.left = ((h.clientWidth - total) / 2 + i * step) + "px";
    s.style.zIndex = i;
    s.innerHTML = cardHTML(c, w);
    s.onclick = () => { if (turn !== 0 || busy) return;
      const k = sel.indexOf(i); if (k >= 0) sel.splice(k,1); else sel.push(i); draw(); };
    h.appendChild(s);
  });
  SEATS[0].c = hand.length;
}

function renderBottom(){
  const c = cur();
  const t = T[lang];
  const who = turn === 0 ? "" : t.theirTurn((lang === "ko" ? ALL : ALL_EN)[turn]) + " \u00B7 ";
  el("need").innerHTML = who + (c
    ? (c.num === 1 ? t.top1 : t.need(c.count, c.num - 1))
    : (turn === 0 ? t.lead : ""));

  const rn = window.__roundNo || 1;
  const NM = lang === "ko" ? KO_N : EN_N;
  const ri = window.__myRankIdx;
  const ord = x => { const s = ["th","st","nd","rd"], v = x % 100; return x + (s[(v-20)%10] || s[v] || s[0]); };
  const rname = (ri == null) ? "" : (lang === "ko" ? (ri + 1) + "등" : ord(ri + 1));
  el("round").textContent = t.roundN(rn) + (rname ? " · " + rname : "");
  const eb = el("endRound"); if (eb) eb.textContent = t.endR;
  el("pass").textContent = t.pass;
  const list = sel.map(i => hand[i]);
  const ok = legal(list) && turn === 0 && !busy;
  const b = el("play");
  b.disabled = !ok;
  b.textContent = turn !== 0 ? t.notTurn
    : !list.length ? t.pick
    : ok ? t.play(list.length)
    : effective(list) === null ? t.mix
    : (cur() && list.length !== cur().count) ? t.cnt(cur().count)
    : t.lower;
  el("pass").disabled = turn !== 0 || busy;
}

function draw(){ renderSeats(); renderPile(); renderHand(); renderBottom(); }

let timerId = null;
function resetTimer(){
  el("timer").innerHTML = "<i></i>";
  if (timerId) clearTimeout(timerId);
  if (turn === 0 && !busy) timerId = setTimeout(() => { if (turn === 0 && !busy) doPass(true); }, 15000);
}

function clearTrick(){
  trick = []; spread = false; SEATS.forEach(s => s.s = "");
  if (checkFinish()) return;
  /* 마지막에 낸 사람이 이미 완주했으면 다음 순번 생존자가 선을 잡는다 */
  turn = lastPlayer == null ? 0 : lastPlayer;
  let guard = 0;
  while (SEATS[turn].c === 0){
    turn = (turn + 1) % SEATS.length;
    if (++guard > SEATS.length){ endRound(); return; }
  }
  busy = false; draw(); resetTimer();
  if (turn !== 0) setTimeout(botTurn, 900);
}

/* 카드를 다 턴 사람을 완주 목록에 올린다 */
function checkFinish(){
  SEATS.forEach((s, i) => { if (s.c === 0 && !finish.includes(i)) finish.push(i); });
  const left = SEATS.map((s, i) => i).filter(i => SEATS[i].c > 0);
  if (left.length <= 1){
    if (left.length === 1) finish.push(left[0]);   // 마지막 한 명이 꼴등
    endRound();
    return true;
  }
  return false;
}
function endRound(){
  busy = true;
  syncGame();
  const G = window.GAME;
  G.finish = finish.slice();
  G.order = finish.slice();                       // 다음 판 순서 = 이번 판 등수
  G.score = G.score || SEATS.map(() => 0);
  finish.forEach((seat, rank) => { G.score[seat] += Math.max(10, 100 - rank * 10); });
  draw();
  if (window.__onRoundEnd) setTimeout(window.__onRoundEnd, 900);
}

function advance(){
  if (checkFinish()) return;
  const alive = SEATS.filter(s => s.c > 0 && s.s !== "pass").length;
  if (alive <= 1 && trick.length){ setTimeout(clearTrick, 950); return; }
  let guard = 0;
  do {
    turn = (turn + 1) % SEATS.length;
    if (++guard > SEATS.length * 2){ endRound(); return; }   // 돌 사람이 없으면 종료
  } while (SEATS[turn].c === 0 || SEATS[turn].s === "pass");
  busy = false; draw(); resetTimer();
  if (turn !== 0) setTimeout(botTurn, 950);
}

/* 손패에서 낼 수 있는 조합 중 가장 약한(숫자 큰) 것 */
function botPick(hold, c){
  const jok = hold.filter(isJ).length;
  const opts = [];
  const maxN = c ? c.num - 1 : 12;
  for (let n = 1; n <= maxN; n++){
    const same = hold.filter(x => x === n).length;
    if (!same) continue;
    if (c){ if (same + jok >= c.count) opts.push({num:n, count:c.count}); }
    else opts.push({num:n, count:same});
  }
  if (!opts.length) return null;
  opts.sort((a, b) => b.num - a.num);
  return opts[0];
}
function takeFrom(hold, num, count){
  let left = count; const out = [];
  for (let i = hold.length - 1; i >= 0 && left; i--)
    if (hold[i] === num){ hold.splice(i, 1); out.push(num); left--; }
  for (let i = hold.length - 1; i >= 0 && left; i--)
    if (isJ(hold[i])){ out.push(hold[i]); hold.splice(i, 1); left--; }
  return out.sort((a, b) => a - b);
}
function botTurn(){
  busy = true;
  const s = SEATS[turn], c = cur();
  const pick = botPick(s.hold, c);
  if (pick && (!c || Math.random() < .82)){
    const used = takeFrom(s.hold, pick.num, pick.count);
    s.c = s.hold.length; lastPlayer = turn;
    trick.push({by: turn, num: pick.num, count: pick.count, cards: used});
    if (clearsPile(pick.num) && s.c > 0){
      draw(); flash(T[lang].cleared);
      setTimeout(() => { trick = []; spread = false; animated = 0;
        SEATS.forEach(x => x.s = ""); busy = false; draw(); resetTimer();
        if (turn !== 0) setTimeout(botTurn, 800); }, 900);
      return;
    }
  } else s.s = "pass";
  draw();
  setTimeout(advance, 620);
}

function clearsPile(numValue){
  return numValue === 2 && window.__opts && window.__opts.clear2;
}
el("play").onclick = () => {
  const list = sel.map(i => hand[i]); if (!legal(list)) return;
  const e = effective(list);
  trick.push({by: 0, num: e, count: list.length, cards: list.slice().sort((a,b) => a-b)});
  hand = hand.filter((_, i) => !sel.includes(i));
  SEATS[0].hold = hand; SEATS[0].c = hand.length;
  sel = []; lastPlayer = 0; busy = true; draw();
  if (clearsPile(e) && SEATS[0].c > 0){
    flash(T[lang].cleared);
    setTimeout(() => { trick = []; spread = false; animated = 0;
      SEATS.forEach(s => s.s = ""); busy = false; draw(); resetTimer(); }, 900);
    return;
  }
  setTimeout(advance, 620);
};
function doPass(auto){
  if (turn !== 0 || busy) return;
  if (timerId) clearTimeout(timerId);
  sel = []; SEATS[0].s = "pass"; busy = true;
  if (auto) flash(T[lang].autoPass);
  draw(); setTimeout(advance, 500);
}
el("pass").onclick = () => doPass(false);

function flash(msg){
  const f = el("flash"); f.textContent = msg; f.style.opacity = 1;
  setTimeout(() => f.style.opacity = 0, 1200);
}

el("ring").addEventListener("click", e => {
  if (!trick.length) return;
  if (e.target.closest(".play, .spread")) { spread = !spread; renderPile(); }
});

document.querySelectorAll("#lang button").forEach(b => {
  b.addEventListener("click", () => {
    lang = b.dataset.l;
    document.documentElement.lang = lang;
    document.querySelectorAll("#lang button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    draw();
  });
});

draw(); resetTimer();
window.addEventListener("resize", draw);

window.addEventListener("langchange", () => { lang = window.__lang; draw(); });

})();

/* 언어는 앱 전체가 하나로 움직인다 */
/* 접속 환경에 맞춰 기본 언어를 고르고, 바꾼 값은 기억한다 */
window.__lang = (function(){
  try { const v = localStorage.getItem("zk_lang"); if (v === "ko" || v === "en") return v; } catch(e){}
  const n = (navigator.language || navigator.userLanguage || "ko").toLowerCase();
  return n.indexOf("ko") === 0 ? "ko" : "en";
})();
window.setLang = l => {
  window.__lang = l;
  try { localStorage.setItem("zk_lang", l); } catch(e){}
  document.documentElement.lang = l;
  document.querySelectorAll("[data-l]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.l === l)));
  window.dispatchEvent(new Event("langchange"));
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-l]");
  if (b) window.setLang(b.dataset.l);
  if (e.target.closest("[data-cfgopen]")) openCfg();
  if (e.target.closest("[data-cfgclose]")) document.getElementById("cfg").classList.remove("on");
});

const CFG_T = {
  ko:{ title:"설정", lang:"언어",
       note:"처음 들어오면 기기 언어에 맞춰 자동으로 정해집니다. 여기서 바꾸면 그 선택을 기억합니다." },
  en:{ title:"Settings", lang:"LANGUAGE",
       note:"The game picks your device language on first visit. Changing it here is remembered." }
};
function openCfg(){
  const t = CFG_T[window.__lang] || CFG_T.ko;
  document.getElementById("cfgT").textContent = t.title;
  document.getElementById("cfgLangL").textContent = t.lang;
  document.getElementById("cfgNote").textContent = t.note;
  document.getElementById("cfg").classList.add("on");
}
window.addEventListener("langchange", () => {
  if (document.getElementById("cfg").classList.contains("on")) openCfg();
});
window.setLang(window.__lang);

function go(id){
  document.querySelectorAll(".page").forEach(p => p.classList.remove("is-on"));
  document.getElementById(id).classList.add("is-on");
  window.scrollTo(0,0);
  /* 숨겨져 있는 동안은 폭이 0이라 손패 위치가 어긋난다. 보이는 순간 다시 그린다 */
  requestAnimationFrame(() => window.dispatchEvent(new Event("resize")));
  /* 방 설정(인원 등)을 그 화면에 반영한다 */
  if (id === "draw"  && window.__bootDraw)  window.__bootDraw();
  if (id === "table" && window.__bootTable){
    window.__bootTable(window.__fresh !== false);
    window.__fresh = false;
  }
  if (id === "tax"   && window.__bootTax)   window.__bootTax();
  if (id === "result" && window.__bootResult) window.__bootResult();
}
document.querySelector("#entry #start").addEventListener("click", () => go("lobby"));

/* 로비 → 대기실 */
["#lobby #btQuick", "#lobby #btNew", "#lobby #btJoin"].forEach(sel => {
  const b = document.querySelector(sel);
  if (b) b.addEventListener("click", () => go("room"));
});
/* 대기실 시작 → 세금·혁명 */
document.querySelector("#room #action").addEventListener("click", e => {
  const b = e.target.closest(".btn-primary");
  if (!b || b.disabled) return;
  go("draw");                     /* 첫 판은 뽑기부터 */
});
/* 뽑기 완료 → 1판 시작 (첫 판은 세금 없음) */
document.querySelector("#draw #go").addEventListener("click", e => {
  if (!e.currentTarget.disabled){ window.__fresh = true; go("table"); }
});
/* 한 판이 끝나면 결과 화면 */
window.__onRoundEnd = () => go("result");
document.querySelector("#table #endRound").addEventListener("click", () => {
  if (window.__forceEnd) window.__forceEnd();
});

/* 결과 → 다음 판 (세금을 켰으면 세금 단계를 거친다) */
document.querySelector("#result #next").addEventListener("click", () => {
  const G = window.GAME || {};
  const rounds = (window.__opts && window.__opts.rounds) || 5;
  if ((G.roundNo || 1) >= rounds){          // 마지막 판이었으면 처음부터
    window.__fresh = true;
    go("draw");
    return;
  }
  G.roundNo = (G.roundNo || 1) + 1;
  window.__roundNo = G.roundNo;
  if (window.__opts && window.__opts.tax === false){
    window.__fresh = true;                   // 세금이 없으면 그냥 새로 나눈다
    go("table");
  } else {
    go("tax");
  }
});
document.querySelector("#result #quit").addEventListener("click", () => go("lobby"));
window.__toResult = () => go("result");

/* 세금까지 마치면 그 손패 그대로 다음 판을 시작한다 */
document.querySelector("#tax #next").addEventListener("click", e => {
  const label = e.currentTarget.textContent.trim();
  if (label === "판 시작" || label === "Start round"){
    window.__fresh = false;
    setTimeout(() => go("table"), 140);
  }
});
/* 뒤로가기 */
document.querySelectorAll("[data-back]").forEach(b =>
  b.addEventListener("click", () => go(b.dataset.back)));

</script>
