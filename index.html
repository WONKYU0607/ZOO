<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#140E0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="동물의 왕국 — 계급 카드게임">
<link rel="icon" href="assets/card_01.webp">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>동물의 왕국 : 계급 카드게임</title>
<link id="webfonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Playfair+Display:wght@700&display=swap">
<style>
:root{
  --card-ink:#3B2A12; --card-ink-2:#5A431C;
  --gold:#C79A3E; --gold-hi:#F0D18C; --gold-dim:#8A6A24;
  --parchment:#F2E2BE; --parchment-dim:#C9B58C;
  --p1:#D6C097; --p2:#C4AA7B; --p3:#AE9362;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0B0803;color:var(--parchment);
  font-family:"Gowun Dodum",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

/* ---------- 배경 ---------- */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.bg__img{position:absolute;inset:-3%;background:url("assets/bg.webp") center/cover no-repeat}
@media (prefers-reduced-motion:no-preference){
  .bg__img{animation:drift 34s ease-in-out infinite alternate}
  @keyframes drift{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.1) translate(-1.4%,-1.6%)}}
}
.bg__top{position:absolute;left:0;right:0;top:0;height:34%;
  background:linear-gradient(180deg,rgba(6,4,2,.7),rgba(6,4,2,.28) 58%,transparent)}
.bg__bot{position:absolute;left:0;right:0;bottom:0;height:34%;
  background:linear-gradient(180deg,transparent,rgba(8,5,2,.5) 52%,rgba(6,4,2,.88) 86%,#0B0803)}
.motes{position:absolute;inset:0;pointer-events:none}
.mote{position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(255,232,178,.95),rgba(220,170,80,0) 68%)}
@media (prefers-reduced-motion:no-preference){
  .mote{animation:rise linear infinite}
  @keyframes rise{
    from{transform:translate3d(0,0,0);opacity:0}
    14%{opacity:.9}86%{opacity:.6}
    to{transform:translate3d(18px,-92vh,0);opacity:0}}
}

/* ---------- 화면 ---------- */
.screen{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 22px)}
.lang{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:16px;z-index:20;
  display:flex;border:1px solid rgba(199,154,62,.66);border-radius:2px;overflow:hidden;
  background:rgba(10,7,3,.5);backdrop-filter:blur(4px)}
.lang button{padding:6px 11px;font-size:11.5px;letter-spacing:.08em;color:var(--parchment-dim)}
.lang button[aria-pressed="true"]{color:#140D04;background:linear-gradient(180deg,var(--gold-hi),var(--gold))}

.spacer{flex:1;min-height:0}

/* ---------- 아래 부채꼴 ---------- */
.fan{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;z-index:3}
.fan__in{position:absolute;left:63%;top:55%;transform:translate(-50%,-50%);width:0;height:0}
.fan .card{position:absolute;transform-origin:50% 168%;box-shadow:0 16px 32px rgba(0,0,0,.8)}
.fan .card[data-i="0"]{transform:rotate(-21deg);filter:brightness(.8) saturate(.94);z-index:1}
.fan .card[data-i="1"]{transform:rotate(-10.5deg);filter:brightness(.92);z-index:2}
.fan .card[data-i="2"]{transform:translateY(-10px) scale(1.07);z-index:5}
.fan .card[data-i="3"]{transform:rotate(10.5deg);filter:brightness(.92);z-index:4}
.fan .card[data-i="4"]{transform:rotate(21deg);filter:brightness(.8) saturate(.94);z-index:3}

.card{--w:80px;width:var(--w);aspect-ratio:200/390;flex:none;
  border-radius:calc(var(--w) * .05);padding:calc(var(--w) * .042);
  background:
    radial-gradient(38% 22% at 16% 12%,rgba(140,106,52,.16),transparent 70%),
    radial-gradient(44% 24% at 70% 92%,rgba(112,82,38,.18),transparent 74%),
    repeating-linear-gradient(96deg,rgba(96,70,32,.045) 0 1px,transparent 1px 4px),
    linear-gradient(162deg,var(--p1),var(--p2) 52%,var(--p3));
  box-shadow:inset 0 0 calc(var(--w) * .09) rgba(108,78,34,.34);
  display:flex;flex-direction:column}
.card__band{display:flex;align-items:center;justify-content:space-between;
  padding:0 calc(var(--w) * .016);height:calc(var(--w) * .208);color:var(--card-ink)}
.card__num{font-family:"Noto Serif KR",serif;font-weight:900;font-size:calc(var(--w) * .152);
  line-height:1;min-width:calc(var(--w) * .145);text-align:center}
.card__name{font-family:"Noto Serif KR",serif;font-weight:700;font-size:calc(var(--w) * .086);
  letter-spacing:.03em;white-space:nowrap;color:var(--card-ink-2)}
body[data-lang="en"] .card__name{font-size:calc(var(--w) * .073);letter-spacing:.01em}
.card.is-joker .card__band{justify-content:center}
.card__mark{font-family:"Noto Serif KR",serif;font-weight:600;font-size:calc(var(--w) * .072);
  letter-spacing:.24em;text-indent:.24em;color:var(--card-ink-2)}
.card__art{flex:1;min-height:0;position:relative;
  border:calc(var(--w) * .011) solid var(--gold-dim);background:#1A1410;overflow:hidden}
.card__art img{width:100%;height:100%;object-fit:cover;display:block}
.card__art::after{content:"";position:absolute;inset:0;
  box-shadow:inset 0 0 0 calc(var(--w) * .011) rgba(240,209,140,.4)}
.plate{position:absolute;left:20px;right:20px;top:19.5%;z-index:3;
  text-align:center;text-shadow:0 3px 16px rgba(0,0,0,.92),0 1px 4px rgba(0,0,0,.85)}
.plate::before{content:"";position:absolute;left:-14%;right:-14%;top:-34px;bottom:-26px;
  z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side,rgba(6,4,2,.72),rgba(6,4,2,.34) 58%,transparent 100%)}
.eyebrow{font-family:"Noto Serif KR",serif;font-weight:600;font-size:12.5px;
  letter-spacing:.34em;text-indent:.34em;color:#E9BE63}
.wordmark{font-family:"Gowun Batang",serif;font-weight:700;
  font-size:clamp(33px,9.4vw,42px);line-height:1.16;margin:13px 0 10px}
body[data-lang="en"] .wordmark{font-family:"Playfair Display",serif;font-size:clamp(35px,10vw,45px)}
.sub{font-size:14px;color:#DCC69C;letter-spacing:.06em}
.hr{height:1px;margin:17px 52px 0;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
.btn{width:100%;padding:16px;border-radius:2px;
  background:linear-gradient(180deg,#8A2A28,#4E1614);border:1px solid var(--gold);
  color:var(--parchment);font-family:"Gowun Batang",serif;font-weight:700;
  font-size:17px;letter-spacing:.08em;
  box-shadow:0 1px 0 rgba(240,209,140,.3) inset,0 8px 24px rgba(0,0,0,.66)}
body[data-lang="en"] .btn{font-family:"Playfair Display",serif}
.btn:active{transform:translateY(1px)}

@media (prefers-reduced-motion:no-preference){
  .fan .card{animation:deal .6s cubic-bezier(.2,.7,.3,1) both}
  .fan .card[data-i="0"]{animation-delay:.5s}
  .fan .card[data-i="4"]{animation-delay:.57s}
  .fan .card[data-i="1"]{animation-delay:.64s}
  .fan .card[data-i="3"]{animation-delay:.71s}
  .fan .card[data-i="2"]{animation-delay:.8s}
  @keyframes deal{from{opacity:0;transform:translateY(34px) rotate(0deg) scale(.9)}}
  .plate>*{animation:rise2 .7s ease both}
  .eyebrow{animation-delay:.15s}
  .wordmark{animation-delay:.28s}
  .sub{animation-delay:.4s}
  .hr{animation-delay:.5s}
  .btn{animation:rise2 .6s ease both;animation-delay:.62s}
  @keyframes rise2{from{opacity:0;transform:translateY(12px)}}
}

.page{display:none}
.page.is-on{display:block}
#entry{position:fixed;inset:0;overflow:hidden}
#lobby,#room,#draw,#tax,#table{position:fixed;inset:0;z-index:30;overflow:hidden}
.navback{font-size:19px;line-height:1;color:#B8A47E;padding:2px 6px;background:none;border:none;cursor:pointer}

#lobby{
  --ink:#140E0A;
  --card-ink:#3B2A12;
  --card-ink-2:#5A431C;
  --gold:#B08A34;
  --gold-hi:#E3C67C;
  --gold-dim:#7A5E24;
  --parchment:#E9D5AC;
  --parchment-dim:#B8A47E;
  --p1:#D6C097; --p2:#C4AA7B; --p3:#AE9362;
}
*{box-sizing:border-box;margin:0;padding:0}
#lobby, #lobby{height:100%}
#lobby{
  background:
    radial-gradient(112% 50% at 50% 0%,rgba(122,34,38,.42),transparent 64%),
    radial-gradient(84% 44% at 50% 104%,rgba(176,138,52,.12),transparent 70%),
    var(--ink);
  color:var(--parchment);
  font-family:"Gowun Dodum",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
#lobby button, #lobby input{font:inherit;color:inherit;background:none;border:none}
#lobby button{cursor:pointer}
#lobby :focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

#lobby .screen{
  height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 20px);
}

#lobby /* ---------- header ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
#lobby .mark{font-family:"Gowun Batang",serif;font-weight:700;font-size:17px;letter-spacing:.03em}
#lobby body[data-lang="en"] .mark{font-family:"Playfair Display",serif;font-size:18px}
#lobby .lang{display:flex;border:1px solid var(--gold-dim);border-radius:2px;overflow:hidden}
#lobby .lang button{padding:5px 10px;font-size:11px;letter-spacing:.08em;color:var(--parchment-dim)}
#lobby .lang button[aria-pressed="true"]{color:#120C07;background:linear-gradient(180deg,var(--gold-hi),var(--gold))}

#lobby /* ---------- body ---------- */
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:22px}
#lobby .block__label{
  font-family:"Noto Serif KR",serif;font-weight:600;
  font-size:11px;letter-spacing:.28em;text-indent:.28em;color:var(--gold);
  margin-bottom:9px;
}
#lobby .btn-primary{
  width:100%;padding:17px;border-radius:2px;
  background:linear-gradient(180deg,#7A2226,#4A1418);
  border:1px solid var(--gold);
  font-family:"Gowun Batang",serif;font-weight:700;font-size:18px;letter-spacing:.08em;
  box-shadow:0 1px 0 rgba(227,198,124,.26) inset,0 6px 18px rgba(0,0,0,.5);
}
#lobby .btn-second{
  width:100%;padding:15px;border-radius:2px;
  border:1px solid var(--gold);
  font-family:"Gowun Batang",serif;font-weight:700;font-size:16px;letter-spacing:.06em;
  color:var(--parchment);
  background:rgba(176,138,52,.07);
}
#lobby body[data-lang="en"] .btn-primary, #lobby body[data-lang="en"] .btn-second{font-family:"Playfair Display",serif;letter-spacing:.08em}
#lobby .btn-primary:active, #lobby .btn-second:active{transform:translateY(1px)}
#lobby .hint{font-size:12px;color:#8E8064;margin-top:8px;line-height:1.65}

#lobby .join{display:flex;gap:9px}
#lobby .join input{
  flex:1;min-width:0;padding:14px 15px;border-radius:2px;
  border:1px solid var(--gold-dim);background:rgba(0,0,0,.34);
  font-family:"Noto Serif KR",serif;font-weight:700;
  font-size:20px;letter-spacing:.42em;text-align:center;color:var(--parchment);
}
#lobby .join input::placeholder{color:#6E6046;font-weight:600}
#lobby .join button{
  padding:0 20px;border-radius:2px;border:1px solid var(--gold-dim);
  font-size:14px;letter-spacing:.05em;color:var(--parchment-dim);white-space:nowrap;
}
#lobby .btn-rules{
  width:100%;padding:13px;border-radius:2px;border:1px solid var(--gold-dim);
  font-size:14px;letter-spacing:.06em;color:var(--parchment-dim);
}

#lobby /* ---------- rules sheet ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;visibility:hidden}
#lobby .sheet.is-open{visibility:visible}
#lobby .sheet__veil{position:absolute;inset:0;background:rgba(6,4,2,.72);opacity:0;transition:opacity .28s ease}
#lobby .sheet.is-open .sheet__veil{opacity:1}
#lobby .sheet__panel{
  position:relative;max-height:90%;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#241811,#150E09);
  border-top:1px solid var(--gold);border-radius:10px 10px 0 0;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.3,1);
  padding-bottom:env(safe-area-inset-bottom);
}
#lobby .sheet.is-open .sheet__panel{transform:none}
#lobby .sheet__head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;border-bottom:1px solid #33261A;
}
#lobby .sheet__title{font-family:"Gowun Batang",serif;font-weight:700;font-size:17px}
#lobby body[data-lang="en"] .sheet__title{font-family:"Playfair Display",serif}
#lobby .sheet__close{font-size:22px;line-height:1;color:var(--parchment-dim);padding:0 4px}
#lobby .sheet__body{overflow-y:auto;padding:16px 20px 26px;-webkit-overflow-scrolling:touch}

#lobby .lead{font-size:13.5px;line-height:1.75;color:#C9B792;margin-bottom:18px}
#lobby .lead b{color:var(--gold-hi);font-weight:400}

#lobby /* rank grid */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 4px;margin-bottom:22px}
#lobby .cell{display:flex;flex-direction:column;align-items:center;gap:5px}
#lobby .cell__c{font-size:10px;color:#7C6C4E;line-height:1}

#lobby /* mini card */
.card{
  --w:100%;
  width:100%;
  aspect-ratio:200/390;
  border-radius:3px;
  padding:2px;
  background:
    radial-gradient(38% 22% at 16% 12%,rgba(140,106,52,.16),transparent 70%),
    radial-gradient(44% 24% at 70% 92%,rgba(112,82,38,.18),transparent 74%),
    linear-gradient(162deg,var(--p1),var(--p2) 52%,var(--p3));
  box-shadow:0 2px 5px rgba(0,0,0,.5);
  display:flex;flex-direction:column;
}
#lobby .card__band{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1px;height:12px;color:var(--card-ink);
}
#lobby .card__num{font-family:"Noto Serif KR",serif;font-weight:900;font-size:8.5px;line-height:1}
#lobby .card__name{
  font-family:"Noto Serif KR",serif;font-weight:700;
  font-size:7px;line-height:1;letter-spacing:-.01em;
  color:var(--card-ink-2);white-space:nowrap;
}
#lobby body[data-lang="en"] .card__name{font-size:5.4px;letter-spacing:.01em}
#lobby .card__art{
  flex:1;min-height:0;position:relative;
  border:1px solid var(--gold-dim);background:#1A1410;overflow:hidden;
}
#lobby .card__art img{width:100%;height:100%;object-fit:cover;display:block}

#lobby /* rules text */
.rule{margin-bottom:16px}
#lobby .rule--joker{display:flex;gap:13px;align-items:flex-start}
#lobby .rule--joker .jk{width:calc((100% - 20px) / 6);flex:none}
#lobby .rule h3{font-family:"Gowun Batang",serif;font-weight:700;font-size:14px;color:var(--gold-hi);margin-bottom:5px}
#lobby body[data-lang="en"] .rule h3{font-family:"Playfair Display",serif}
#lobby .rule p{font-size:13px;line-height:1.75;color:#B7A683}
#lobby .rule p b{color:var(--gold-hi);font-weight:400}


#draw{
  --card-ink:#3B2A12; --card-ink-2:#5A431C;
  --gold:#B08A34; --gold-hi:#E3C67C; --gold-dim:#7A5E24;
  --parchment:#E9D5AC; --parchment-dim:#B8A47E;
  --p1:#D6C097; --p2:#C4AA7B; --p3:#AE9362;
}
*{box-sizing:border-box;margin:0;padding:0}
#draw, #draw{height:100%}
#draw{background:radial-gradient(96% 44% at 50% 34%,#2E5540,#16291F 54%,#0B140F);
  color:var(--parchment);font-family:"Gowun Dodum",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
#draw button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
#draw :focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
#draw .screen{height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px)}

#draw .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
#draw .bar__t{font-family:"Gowun Batang",serif;font-weight:700;font-size:13.5px;color:#CFE0D4}
#draw .lang{display:flex;border:1px solid var(--gold-dim);border-radius:2px;overflow:hidden}
#draw .lang button{padding:4px 8px;font-size:10px;color:var(--parchment-dim)}
#draw .lang button[aria-pressed="true"]{color:#120C07;background:linear-gradient(180deg,var(--gold-hi),var(--gold))}

#draw .ring{height:66%;flex:none;position:relative;margin-top:4px}
#draw .plane{position:absolute;left:0;right:0;top:19%;bottom:13%}
#draw .pad{flex:1;min-height:0}
#draw .felt{position:absolute;left:2%;right:2%;top:2%;bottom:2%;border-radius:50%;
  background:radial-gradient(70% 56% at 50% 32%,#3A6A52,#2A4E3B 48%,#16291F);
  box-shadow:0 0 0 4px rgba(80,58,22,.6),0 0 0 6px rgba(198,154,60,.26),inset 0 0 60px rgba(0,0,0,.4)}

#draw .seat{position:absolute;width:74px;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;z-index:6}
#draw .seat__av{width:42px;height:42px;border-radius:50%;object-fit:cover;
  border:2px solid rgba(198,154,60,.55);background:#241A12;box-shadow:0 3px 9px rgba(0,0,0,.6);
  transition:border-color .3s ease}
#draw .seat--me .seat__av{width:46px;height:46px;border-color:#E3C67C}
#draw .seat--turn .seat__av{border-color:var(--gold-hi);box-shadow:0 0 0 3px rgba(227,198,124,.3),0 3px 9px rgba(0,0,0,.6)}
#draw .seat--tie .seat__av{border-color:#E36C4C;box-shadow:0 0 0 3px rgba(227,108,76,.3)}
#draw .seat__n{font-size:10.5px;line-height:1.2;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.9)}
#draw .seat__d{font-family:"Noto Serif KR",serif;font-weight:900;font-size:11px;
  color:#120C07;background:linear-gradient(180deg,#E3C67C,#B08A34);
  padding:1px 8px;border-radius:8px;line-height:16px;
  box-shadow:0 2px 6px rgba(0,0,0,.6)}
#draw .seat__r{font-family:"Gowun Batang",serif;font-weight:700;font-size:10.5px;
  padding:1px 7px;border-radius:2px;white-space:nowrap;
  background:rgba(10,16,12,.9);border:1px solid var(--gold-dim);color:var(--gold-hi);
  opacity:0;transform:translateY(-4px);transition:opacity .35s ease,transform .35s ease}
#draw .seat__r.on{opacity:1;transform:none}

#draw /* 바닥에 깔린 뽑을 카드 */
.deck{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  display:grid;grid-template-columns:repeat(var(--cols,4),var(--pw,44px));
  gap:9px;justify-content:center;z-index:5;--pw:34px}
#draw .pk{width:var(--pw,34px);aspect-ratio:200/390;perspective:600px;cursor:pointer;
  transition:transform .3s ease,opacity .35s ease}
#draw .pk__in{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.3,.8,.3,1)}
#draw .pk.flip .pk__in{transform:rotateY(180deg)}
#draw .pk__f{position:absolute;inset:0;backface-visibility:hidden;border-radius:4px;overflow:hidden;
  box-shadow:0 5px 14px rgba(0,0,0,.6)}
#draw .pk__f--b{background:#1A1410;border:1px solid rgba(198,154,60,.5)}
#draw .pk__f--b img{width:100%;height:100%;object-fit:cover;display:block}
#draw .pk__f--a{transform:rotateY(180deg)}
#draw .pk:not(.taken):hover{transform:translateY(-6px)}
#draw .pk.taken{cursor:default;opacity:.62}
#draw .pk.gone{opacity:0;transform:scale(.86)}

#draw .card{--w:52px;width:100%;height:100%;
  border-radius:4px;padding:calc(var(--w) * .042);
  background:radial-gradient(38% 22% at 16% 12%,rgba(140,106,52,.16),transparent 70%),
    linear-gradient(162deg,var(--p1),var(--p2) 52%,var(--p3));
  display:flex;flex-direction:column}
#draw .card__band{display:flex;align-items:center;justify-content:space-between;
  padding:0 2px;height:calc(var(--w) * .2);color:var(--card-ink)}

  position:absolute;left:8%;right:8%;top:12%;bottom:12%;

}
#room .sw{width:46px;height:26px;border-radius:13px;border:1px solid var(--gold-dim);background:rgba(0,0,0,.4);position:relative;flex:none}
#room .sw::after{
  content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:#7B6C50;transition:transform .18s ease,background .18s ease;

#room .sw[aria-checked="true"]{background:rgba(176,138,52,.3);border-color:var(--gold)}

#room .btn-primary{
  width:100%;padding:16px;border-radius:2px;
  background:linear-gradient(180deg,#7A2226,#4A1418);
  border:1px solid var(--gold);
  font-family:"Gowun Batang",serif;font-weight:700;font-size:17px;letter-spacing:.08em;

#room .waiting{
  width:100%;padding:16px;border:1px solid var(--gold-dim);border-radius:2px;

}
#room .dots::after{content:"";animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}


#tax{

#tax /* ring */
.ring{flex:1;min-height:0;position:relative;margin-top:6px}

#tax .felt{position:absolute;left:2%;right:2%;top:2%;bottom:2%;border-radius:50%;

/* 배경에 사자 왕이 있어서 부채꼴에서는 사자를 뺐다 */
const FAN = [
  {key:"10", num:"10", ko:"토끼",   en:"RABBIT"},
  {key:"joker_a", joker:true, ko:"카멜레온", en:"CHAMELEON"},

];

  ko:{eyebrow:"ZOO PRESIDENT", wordmark:"동물의 왕국", sub:"계급 카드게임", start:"게임 시작"},
  en:{eyebrow:"CARD CLASH", wordmark:"Zoo President", sub:"Climbing card game", start:"Start game"}
};
let lang = "ko";

const fan = document.getElementById("fan");
function renderFan(){
  fan.innerHTML = "";
  FAN.forEach((c, i) => {
    const d = document.createElement("div");

          '<span class="card__num">' + c.num + '</span>' +
        '</div>' +
        '<div class="card__art"><img src="' + IMG[c.key] + '" alt=""></div>' +
        '<div class="card__band">' +
          '<span class="card__num">' + c.num + '</span>' +
          '<span class="card__num">' + c.num + '</span>' +
        '</div>';
    fan.appendChild(d);
  });
}

function apply(){
  const t = T[lang];
  document.body.dataset.lang = lang;
  document.documentElement.lang = lang;
  document.getElementById("eyebrow").textContent = t.eyebrow;

}
apply();

const motes = document.getElementById("motes");

    "width:" + size.toFixed(1) + "px;height:" + size.toFixed(1) + "px;" +
    "animation-duration:" + (13 + Math.random() * 14).toFixed(1) + "s;" +
    "animation-delay:-" + (Math.random() * 24).toFixed(1) + "s";
  motes.appendChild(s);
}

document.querySelectorAll("#lang button").forEach(b => {
  b.addEventListener("click", () => {
    lang = b.dataset.l;
    document.querySelectorAll("#lang button").forEach(x =>

    apply();
  });
});

<script>

function makeDeck(){

  for (let n = 1; n <= 12; n++) for (let i = 0; i < n; i++) d.push(n);
  d.push(13, 14);
  for (let i = d.length - 1; i > 0; i--){
    const k = Math.floor(Math.random() * (i + 1));
    [d[i], d[k]] = [d[k], d[i]];
  }
  return d;
}

  let best = null;
  pickOrder.forEach(i => {
    if (drawn[i] == null) return;

  });
  return best === null ? 0 : best;
}
function ranking(){
  const w = winner();

function pick(seat, k){
  const w = el("deck").querySelector('.pk[data-k="' + k + '"]:not(.taken)');

  drawn[seat] = pool[k];
  pickOrder.push(seat);
  waiting = waiting.filter(x => x !== seat);

  const seat = waiting[0];

const T = {
  ko:{

    dealH:"패 나누기", dealS:"80장을 골고루 나눕니다. 이 순간 카멜레온 두 장이 한 사람에게 몰리면 혁명이 열립니다.",
    rankH:"이번 판의 계급", rankS:"손을 턴 순서가 그대로 계급이 됩니다. 위에서부터 사자·호랑이, 아래에서부터 생쥐·새 순입니다.",

    revOther:n=>n+"님이 카멜레온 두 장을 쥐고 혁명을 선언했습니다. 이번 판 세금은 없습니다.",
    revGreatMine:"꼴등인데 카멜레온 두 장을 모두 쥐었습니다. 대혁명을 선언하면 세금이 사라지고 계급이 통째로 뒤집힙니다.",

let lang = "ko", scn = 0, step = 0, sel = [], declared = false, reversed = false;

const NAMES = ["나","민지","준호","서연","태윤","하은","지훈","예린"];
const EN_NAMES = ["You","Minji","Junho","Seoyeon","Taeyun","Haeun","Jihoon","Yerin"];
const nameOf = i => (lang === "ko" ? NAMES : EN_NAMES)[i];

/* 시나리오별 등수 (order[k] = k등인 자리 번호) */
let N = 6;
const seq = n => Array.from({length: n}, (_, i) => i);
let SCN = [];
function buildScn(){
  const a = seq(N);                       // 내가 1등
  const b = a.slice(1).concat([0]);       // 내가 꼴등
  const c = [1, 0].concat(a.slice(2));    // 내가 2등
  SCN = [
    {order:a, hand:[1,3,3,6,8,9,11,12,12], rev:null},
    {order:b, hand:[4,6,7,9,10,11,12,12,12], rev:null},
    {order:c, hand:[2,5,6,8,9,10,11,12,12], rev:2},
    {order:b, hand:[6,8,9,10,11,12,12,13,14], rev:0}
  ];
}
buildScn();
let hand = [];

const art = n => n === 13 ? ART.jokerA : n === 14 ? ART.jokerB : ART[String(n).padStart(2,"0")];
function cardHTML(n, w){
  if (isJ(n)) return '<div class="card" style="--w:' + w + 'px">' +
    '<div class="card__band"></div><div class="card__art"><img src="' + art(n) + '" alt=""></div>' +
    '<div class="card__band"></div></div>';
  return '<div class="card" style="--w:' + w + 'px">' +
    '<div class="card__band"><span class="card__num">' + n + '</span>' +
    '<span class="card__num">' + n + '</span></div>' +
    '<div class="card__art"><img src="' + art(n) + '" alt=""></div>' +
    '<div class="card__band"><span class="card__num">' + n + '</span>' +
    '<span class="card__num">' + n + '</span></div></div>';
}

/* 등수 → 자리, 자리 → 등수 */
function order(){ const o = SCN[scn].order.slice(); return reversed ? o.slice().reverse() : o; }
function rankOf(seat){ return order().indexOf(seat); }
/* 계급 호칭 = 덱 순서. 위에서부터 사자·호랑이·…, 아래에서부터 생쥐·새·… */
function rankName(r){
  const N = lang === "ko" ? KO_N : EN_N, n = order().length;
  return r < n / 2 ? N[r] : N[11 - (n - 1 - r)];
}
function seatPos(i){
  const a = (Math.PI / 2) + (i * 2 * Math.PI / N);
  return {x: 50 + Math.cos(a) * -40, y: 50 + Math.sin(a) * 44};
}

/* from/to: 자리 번호, -1이면 가운데 */
function flyCard(from, to, card, delay, faceDown){
  const a = from < 0 ? {x:50,y:50} : seatPos(from);
  const b = to   < 0 ? {x:50,y:50} : seatPos(to);
  const d = document.createElement("div");
  d.className = "fly";
  d.style.left = a.x + "%"; d.style.top = a.y + "%";
  d.style.transform = "translate(-50%,-50%) scale(.7)";
  d.style.opacity = 0;
  d.innerHTML = faceDown ? backHTML(32) : cardHTML(card, 32);
  el("fx").appendChild(d);
  setTimeout(() => {
    d.style.opacity = 1;
    d.style.left = b.x + "%"; d.style.top = b.y + "%";
    d.style.transform = "translate(-50%,-50%) scale(1) rotate(" + (Math.random()*20-10).toFixed(0) + "deg)";
  }, delay + 20);
  setTimeout(() => { d.style.opacity = 0; }, delay + 620);
  setTimeout(() => d.remove(), delay + 950);
}
function backHTML(w){
  return '<div class="card" style="--w:' + w + 'px;padding:2px"><div class="card__art" style="border-width:1px">' +
    '<img src="' + ART.back + '" alt=""></div></div>';
}
function clearFx(){ el("fx").innerHTML = ""; }

/* 새 패 나눠 주기 */
function runDeal(){
  clearFx();
  for (let round = 0; round < 3; round++)
    for (let i = 0; i < N; i++)
      flyCard(-1, i, 0, (round * 6 + i) * 55, true);
}

/* 세금 주고받기 */
function runTax(){
  clearFx();
  const o = order(), n = N;
  const pairs = [[o[0], o[n-1], 2], [o[1], o[n-2], 1]];
  const best = hand.slice().sort((a,b) => a-b);
  let t = 0;
  pairs.forEach(([hi, lo, k]) => {
    /* 내가 낀 교환만 앞면. 남들끼리 주고받는 건 원래 안 보이는 정보라 뒷면 */
    const mine = hi === 0 || lo === 0;
    for (let j = 0; j < k; j++){
      const c = lo === 0 ? best[j] : 2 + j;
      flyCard(lo, hi, c, t, !mine);
      t += 150;
    }
    for (let j = 0; j < k; j++){
      const c = hi === 0 && sel.length ? hand[sel[j]] : 12;
      flyCard(hi, lo, c, t, !mine);
      t += 150;
    }
  });
}

function renderSeats(){
  const box = el("seats"); box.innerHTML = "";
  for (let i = 0; i < N; i++){
    const p = seatPos(i), r = rankOf(i), n = N;
    const d = document.createElement("div");
    d.className = "seat" + (i === 0 ? " seat--me" : "") +
      (step >= 1 && r <= 1 ? " seat--top" : "") + (step >= 1 && r >= n - 2 ? " seat--bot" : "");
    d.style.left = p.x.toFixed(1) + "%"; d.style.top = p.y.toFixed(1) + "%";
    d.innerHTML =
      '<span class="seat__r' + (step >= 1 ? " on" : "") + '">' + rankName(r) + '</span>' +
      '<img class="seat__av" src="' + HEADS[i] + '" alt="">' +
      '<span class="seat__n">' + nameOf(i) + '</span>';
    box.appendChild(d);
  }
}

function renderHand(){
  const h = el("hand"); h.innerHTML = "";
  const w = 54, n = hand.length;
  const step2 = n > 1 ? Math.min(40, (h.clientWidth - w) / (n - 1)) : 0;
  const total = w + step2 * (n - 1);
  const taken = takenIdx();
  hand.forEach((c, i) => {
    const s = document.createElement("div");
    s.className = "slot" + (sel.includes(i) ? " slot--sel" : "") + (taken.includes(i) ? " slot--take" : "");
    s.style.left = ((h.clientWidth - total) / 2 + i * step2) + "px";
    s.style.zIndex = i;
    s.innerHTML = cardHTML(c, w);
    s.onclick = () => { if (!giveCount()) return;
      const k = sel.indexOf(i);
      if (k >= 0) sel.splice(k, 1);
      else if (sel.length < giveCount()) sel.push(i);
      draw(); };
    h.appendChild(s);
  });
}

/* 내가 세금으로 몇 장을 줘야 하나 */
function giveCount(){
  if (step !== 3 || taxSkipped()) return 0;
  const r = rankOf(0), n = N;
  return r === 0 ? 2 : r === 1 ? 1 : 0;
}
/* 내가 뺏기는 카드 (가장 좋은 = 숫자 작은 순) */
function takenIdx(){
  if (step !== 3 || taxSkipped()) return [];
  const r = rankOf(0), n = N;
  const k = r === n - 1 ? 2 : r === n - 2 ? 1 : 0;
  return hand.map((c, i) => i).sort((a, b) => hand[a] - hand[b]).slice(0, k);
}
function taxSkipped(){ return SCN[scn].rev !== null && declared; }

function renderMid(){
  const t = T[lang], m = el("mid"), r = rankOf(0), n = N, o = order();
  let html = "";
  if (step === 0){
    html = '<div class="mid__h">' + t.rankH + '</div><div class="mid__s">' + t.rankS + '</div>';
  } else if (step === 1){
    html = '<div class="mid__h">' + t.dealH + '</div><div class="mid__s">' + t.dealS + '</div>';
  } else if (step === 2){
    const rev = SCN[scn].rev;
    html = '<div class="mid__h">' + t.revH + '</div><div class="mid__s">' +
      (rev === null ? t.revNone
       : declared ? (rev === 0 ? (scn === 3 ? t.revGreatDone : t.revOther(nameOf(0))) : t.revOther(nameOf(rev)))
       : rev === 0 ? (scn === 3 ? t.revGreatMine : t.revMine)
       : t.revOther(nameOf(rev))) + '</div>';
    if (rev === 0 && !declared)
      html += '<div class="flow rev"><div class="frow"><span class="frow__c">' +
        cardHTML(13, 40) + cardHTML(14, 40) + '</span></div></div>';
  } else if (step === 3){
    html = '<div class="mid__h">' + t.taxH + '</div><div class="mid__s">' +
      (taxSkipped() ? t.taxSkip
       : r === 0 ? t.taxMineTop(nameOf(o[n-1]))
       : r === 1 ? t.taxMineTop2(nameOf(o[n-2]))
       : r === n-1 ? t.taxMineBot(nameOf(o[0]))
       : r === n-2 ? t.taxMineBot2(nameOf(o[1]))
       : t.taxMid) + '</div>';
    if (!taxSkipped()){
      const inC = r === 0 ? [2,3] : r === 1 ? [4] : [];
      const outC = takenIdx().map(i => hand[i]);
      let rows = "";
      if (inC.length) rows += '<div class="frow frow--in"><span class="frow__w">' +
        nameOf(o[n-1 - (r === 1 ? 1 : 0)]) + ' →</span><span class="frow__c">' +
        inC.map(c => cardHTML(c, 34)).join("") + '</span></div>';
      if (outC.length) rows += '<div class="frow frow--out"><span class="frow__w">→ ' +
        nameOf(o[r === n-1 ? 0 : 1]) + '</span><span class="frow__c">' +
        outC.map(c => cardHTML(c, 34)).join("") + '</span></div>';
      if (sel.length) rows += '<div class="frow frow--out"><span class="frow__w">→ ' +
        nameOf(o[n-1 - (r === 1 ? 1 : 0)]) + '</span><span class="frow__c">' +
        sel.map(i => cardHTML(hand[i], 34)).join("") + '</span></div>';
      if (rows) html += '<div class="flow">' + rows + '</div>';
    }
  } else {
    html = '<div class="mid__h">' + t.doneH + '</div><div class="mid__s">' + t.doneS(nameOf(order()[0])) + '</div>';
  }
  m.innerHTML = html;
}

function renderBottom(){
  const t = T[lang], rev = SCN[scn].rev;
  el("step").textContent = (step + 1) + ". " + t.steps[step];
  el("back").textContent = t.back;
  const g = giveCount();
  el("hint").innerHTML = step === 3 && g
    ? (sel.length < g ? t.giveNeed(g - sel.length) : "")
    : "";
  const b = el("next");
  if (step === 2 && rev === 0 && !declared){
    b.className = "bt-rev"; b.textContent = scn === 3 ? t.declareG : t.declare; b.disabled = false;
  } else {
    b.className = "bt-main";
    b.textContent = step === 4 ? t.start : step === 3 && g ? t.give(g) : t.next;
    b.disabled = step === 3 && g > 0 && sel.length < g;
  }
}

function draw(){
  renderSeats(); renderMid(); renderHand(); renderBottom();
  if (step >= 1) window.__myRank = rankName(rankOf(0));
}

function reset(){
  clearFx(); step = 0; sel = []; declared = false; reversed = false;
  hand = SCN[scn].hand.slice();
  draw();
}
function boot(){
  N = (window.__opts && window.__opts.cap) || 6;
  buildScn();
  reset();
}
window.__bootTax = boot;
boot();

el("next").onclick = () => {
  const rev = SCN[scn].rev;
  if (step === 2 && rev === 0 && !declared){
    declared = true;
    if (scn === 3){
      reversed = true;
      el("flash").classList.remove("go"); void el("flash").offsetWidth; el("flash").classList.add("go");
      draw();
      document.querySelectorAll(".seat__r").forEach(x => x.classList.add("swap"));
      setTimeout(() => document.querySelectorAll(".seat__r").forEach(x => x.classList.remove("swap")), 750);
      return;
    }
    draw(); return;
  }
  if (step === 2 && rev !== null && rev !== 0 && !declared){ declared = true; }
  if (step === 3 && giveCount()){ hand = hand.filter((_, i) => !sel.includes(i)); sel = []; }
  if (step === 3){
    const take = takenIdx();
    if (take.length) hand = hand.filter((_, i) => !take.includes(i));
  }
  if (step < 4) step++;
  draw();
  if (step === 1) runDeal();
  if (step === 3 && !taxSkipped()) runTax();
};
el("back").onclick = reset;

document.querySelectorAll("#scn button").forEach(b => {
  b.addEventListener("click", () => {
    scn = +b.dataset.s;
    document.querySelectorAll("#scn button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    reset();
  });
});
document.querySelectorAll("#lang button").forEach(b => {
  b.addEventListener("click", () => {
    lang = b.dataset.l;
    document.documentElement.lang = lang;
    document.querySelectorAll("#lang button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    draw();
  });
});
window.addEventListener("resize", draw);

})();
(function(){

const HEADS = ["assets/head_01.webp", "assets/head_02.webp", "assets/head_04.webp", "assets/head_10.webp", "assets/head_06.webp", "assets/head_09.webp", "assets/head_07.webp", "assets/head_12.webp"], ART = {"01": "assets/card_01.webp", "02": "assets/card_02.webp", "03": "assets/card_03.webp", "04": "assets/card_04.webp", "05": "assets/card_05.webp", "06": "assets/card_06.webp", "07": "assets/card_07.webp", "08": "assets/card_08.webp", "09": "assets/card_09.webp", "10": "assets/card_10.webp", "11": "assets/card_11.webp", "12": "assets/card_12.webp", "jokerA": "assets/joker_a.webp", "jokerB": "assets/joker_b.webp"};
const KO_N = ["사자","호랑이","불곰","코끼리","악어","여우","기린","멧돼지","원숭이","토끼","새","생쥐"];
const EN_N = ["LION","TIGER","BEAR","ELEPHANT","CROCODILE","FOX","GIRAFFE","BOAR","MONKEY","RABBIT","BIRD","MOUSE"];

};
let lang = "ko";
const NAMES = KO_N;
const el = id => document.getElementById(id);
const isJ = c => c >= 13;   // 카멜레온 2장: 13=광대, 14=신사

/* 0번이 나. 시계 방향으로 상대 */
const ALL = ["나","민지","준호","서연","태윤","하은","지훈","예린"];
let SEATS = ALL.slice(0, 6).map(n => ({n: n, c: 0, s: ""}));

/* 80장 덱: 1번 1장 ~ 12번 12장 + 카멜레온 2장 */
function makeDeck(){
  const d = [];
  for (let n = 1; n <= 12; n++) for (let i = 0; i < n; i++) d.push(n);
  d.push(13, 14);
  for (let i = d.length - 1; i > 0; i--){
    const k = Math.floor(Math.random() * (i + 1));
    [d[i], d[k]] = [d[k], d[i]];
  }
  return d;
}
function dealAll(){
  const d = makeDeck(), n = SEATS.length;
  SEATS.forEach(s => s.hold = []);
  d.forEach((c, i) => SEATS[i % n].hold.push(c));
  SEATS.forEach(s => { s.hold.sort((a,b) => a-b); s.c = s.hold.length; });
}
dealAll();
let hand = SEATS[0].hold;
function boot(){
  const n = (window.__opts && window.__opts.cap) || 6;
  SEATS = ALL.slice(0, n).map(x => ({n: x, c: 0, s: ""}));
  dealAll();
  hand = SEATS[0].hold;
  sel = []; trick = []; turn = 0; lastPlayer = null; busy = false; animated = 0; spread = false;
  draw(); resetTimer();
}
window.__bootTable = boot;
let sel = [];
let trick = [];              // 이번 판에 나온 것들
let turn = 0;                // 지금 차례
let lastPlayer = null;
let busy = false;
let animated = 0;   // 이미 날아온 카드 수
let spread = false; // 바닥 펼침 여부

const cur = () => trick.length ? trick[trick.length - 1] : null;
const label = n => isJ(n) ? T[lang].joker : (lang === "ko" ? KO_N : EN_N)[n-1];
const art = n => n === 13 ? ART.jokerA : n === 14 ? ART.jokerB : ART[String(n).padStart(2,"0")];

function cardHTML(n, w){
  if (isJ(n)) return '<div class="card is-joker" style="--w:' + w + 'px">' +
    '<div class="card__band"><span class="card__name">카멜레온</span></div>' +
    '<div class="card__art"><img src="' + art(n) + '" alt=""></div>' +
    '<div class="card__band"></div></div>';
  return '<div class="card" style="--w:' + w + 'px">' +
    '<div class="card__band"><span class="card__num">' + n + '</span>' +
    '<span class="card__name">' + label(n) + '</span>' +
    '<span class="card__num">' + n + '</span></div>' +
    '<div class="card__art"><img src="' + art(n) + '" alt=""></div>' +
    '<div class="card__band"><span class="card__num">' + n + '</span>' +
    '<span class="card__num">' + n + '</span></div></div>';
}

function seatPos(i){
  const a = (Math.PI / 2) + (i * 2 * Math.PI / SEATS.length);
  return {x: 50 + Math.cos(a) * -40, y: 50 + Math.sin(a) * 44};
}

function maxCount(n){
  const j = hand.filter(isJ).length;
  return isJ(n) ? j : hand.filter(x => x === n).length + j;
}
function isDead(n){
  const c = cur(); if (!c) return false;
  if (isJ(n)) return !KO_N.some((_, i) => i + 1 < c.num && maxCount(i + 1) >= c.count);
  return !(n < c.num && maxCount(n) >= c.count);
}
function effective(l){
  const r = l.filter(x => !isJ(x));
  if (!r.length) return 13;
  return r.every(x => x === r[0]) ? r[0] : null;
}
function legal(l){
  if (!l.length) return false;
  const e = effective(l); if (e === null) return false;
  const c = cur(); if (!c) return true;
  return l.length === c.count && e < c.num;
}

function fanHTML(c){
  if (!c) return '<div class="fan"></div>';
  const shown = Math.min(c, 7), step = 5;
  const w = 13 + (shown - 1) * step;
  let s = '<div class="fan" style="width:' + w + 'px">';
  for (let i = 0; i < shown; i++)
    s += '<i style="left:' + (i * step) + 'px;z-index:' + i + '"></i>';
  return s + '</div>';
}

function renderSeats(){
  const box = el("seats"); box.innerHTML = "";
  SEATS.forEach((s, i) => {
    const p = seatPos(i);
    const d = document.createElement("div");
    d.className = "seat" + (i === 0 ? " seat--me" : "") +
      (turn === i && !busy ? " seat--turn" : "") +
      (s.s === "pass" ? " seat--pass" : "") + (s.c === 0 ? " seat--out" : "");
    d.style.left = p.x.toFixed(1) + "%"; d.style.top = p.y.toFixed(1) + "%";
    d.style.zIndex = 6 + Math.round(p.y);
    const tag = s.c === 0 ? "완주" : turn === i ? "차례" : s.s === "pass" ? "패스" : "";
    d.innerHTML = (tag ? '<span class="seat__tag">' + tag + '</span>' : '') +
      '<img class="seat__av" src="' + HEADS[i] + '" alt="">' +
      '<span class="seat__n">' + s.n + '</span>' +
      (i === 0 ? '' : fanHTML(s.c)) +
      '<span class="seat__c">' + T[lang].left(s.c) + '</span>';
    box.appendChild(d);
  });
}

function renderPile(){
  const p = el("pile"); p.innerHTML = "";
  if (spread && trick.length){
    const t = T[lang];
    const maxC = Math.min(6, Math.max(...trick.map(x => x.count)));
    const cw = Math.max(18, Math.min(32, Math.floor((196 - (maxC - 1) * 3) / maxC)));
    p.innerHTML = '<div class="spread">' + trick.slice().reverse().map((x, idx) =>
      '<div class="srow' + (idx === 0 ? ' srow--new' : '') + '">' +
        '<span class="srow__w">' + SEATS[x.by].n + '</span>' +
        '<span class="srow__c">' +
          (x.cards || Array.from({length: x.count}, () => x.num))
            .slice(0, 6).map(cc => cardHTML(cc, cw, isJ(cc) ? x.num : null)).join("") +
          (x.count > 6 ? '<span class="srow__p">+' + (x.count - 6) + '</span>' : '') +
        '</span>' +
      '</div>').join("") + '<div class="spread__t">' + t.close + '</div></div>';
    return;
  }
  if (!trick.length){
    p.innerHTML = '<div class="pile__hint">' + T[lang].emptyPile + '</div>';
    animated = 0;
    return;
  }
  const rect = el("ring").getBoundingClientRect();
  trick.forEach((t, k) => {
    const from = seatPos(t.by);
    const g = document.createElement("div");
    g.className = "play" + (k < trick.length - 1 ? " play--old" : "") +
      (k >= animated ? " play--new" : "");
    const d = trick.length - 1 - k;
    g.style.setProperty("--r", d === 0 ? "0deg" : (((k * 37) % 19) - 9 - d * 3) + "deg");
    g.style.setProperty("--dy", (-d * 13) + "px");
    g.style.setProperty("--sc", (1 - d * 0.07).toFixed(3));
    g.style.setProperty("--fx", ((from.x - 50) / 100 * rect.width).toFixed(0) + "px");
    g.style.setProperty("--fy", ((from.y - 50) / 100 * rect.height).toFixed(0) + "px");
    g.style.zIndex = k;
    const cw = Math.max(20, Math.min(52, Math.floor((rect.width * 0.56 - (t.count - 1) * 4) / t.count)));
    g.innerHTML = (t.cards || Array.from({length: t.count}, () => t.num))
      .map(cc => cardHTML(cc, cw, isJ(cc) ? t.num : null)).join("");
    p.appendChild(g);
  });
  animated = trick.length;
}

function renderHand(){
  const h = el("hand"); h.innerHTML = "";
  const w = 60, n = hand.length;
  const step = n > 1 ? Math.min(36, (h.clientWidth - w) / (n - 1)) : 0;
  const total = w + step * (n - 1);
  hand.forEach((c, i) => {
    const s = document.createElement("div");
    s.className = "slot" + (sel.includes(i) ? " slot--sel" : "") + (isDead(c) ? " slot--dead" : "");
    s.style.left = ((h.clientWidth - total) / 2 + i * step) + "px";
    s.style.zIndex = i;
    s.innerHTML = cardHTML(c, w);
    s.onclick = () => { if (turn !== 0 || busy) return;
      const k = sel.indexOf(i); if (k >= 0) sel.splice(k,1); else sel.push(i); draw(); };
    h.appendChild(s);
  });
  SEATS[0].c = hand.length;
}

function renderBottom(){
  const c = cur();
  const t = T[lang];
  el("need").innerHTML = c
    ? (c.num === 1 ? t.top1 : t.need(c.count, c.num - 1))
    : (turn === 0 ? t.lead : "");
  el("phase").textContent = turn === 0 ? t.myTurn : t.theirTurn(SEATS[turn].n);
  const rn = window.__roundNo || 1;
  el("round").textContent = t.roundN(rn) + (window.__myRank ? " · " + window.__myRank : "");
  el("pass").textContent = t.pass;
  const list = sel.map(i => hand[i]);
  const ok = legal(list) && turn === 0 && !busy;
  const b = el("play");
  b.disabled = !ok;
  b.textContent = turn !== 0 ? t.notTurn
    : !list.length ? t.pick
    : ok ? t.play(list.length)
    : effective(list) === null ? t.mix
    : (cur() && list.length !== cur().count) ? t.cnt(cur().count)
    : t.lower;
  el("pass").disabled = turn !== 0 || busy;
}

function draw(){ renderSeats(); renderPile(); renderHand(); renderBottom(); }

let timerId = null;
function resetTimer(){
  el("timer").innerHTML = "<i></i>";
  if (timerId) clearTimeout(timerId);
  if (turn === 0 && !busy) timerId = setTimeout(() => { if (turn === 0 && !busy) doPass(true); }, 15000);
}

function clearTrick(){
  trick = []; spread = false; SEATS.forEach(s => s.s = "");
  turn = lastPlayer; busy = false; draw(); resetTimer();
  if (turn !== 0) setTimeout(botTurn, 900);
}

function advance(){
  const alive = SEATS.filter((s, i) => s.c > 0 && s.s !== "pass").length;
  if (alive <= 1 && trick.length){ setTimeout(clearTrick, 950); return; }
  do { turn = (turn + 1) % SEATS.length; }
  while (SEATS[turn].c === 0 || SEATS[turn].s === "pass");
  busy = false; draw(); resetTimer();
  if (turn !== 0) setTimeout(botTurn, 950);
}

/* 손패에서 낼 수 있는 조합 중 가장 약한(숫자 큰) 것 */
function botPick(hold, c){
  const jok = hold.filter(isJ).length;
  const opts = [];
  const maxN = c ? c.num - 1 : 12;
  for (let n = 1; n <= maxN; n++){
    const same = hold.filter(x => x === n).length;
    if (!same) continue;
    if (c){ if (same + jok >= c.count) opts.push({num:n, count:c.count}); }
    else opts.push({num:n, count:same});
  }
  if (!opts.length) return null;
  opts.sort((a, b) => b.num - a.num);
  return opts[0];
}
function takeFrom(hold, num, count){
  let left = count; const out = [];
  for (let i = hold.length - 1; i >= 0 && left; i--)
    if (hold[i] === num){ hold.splice(i, 1); out.push(num); left--; }
  for (let i = hold.length - 1; i >= 0 && left; i--)
    if (isJ(hold[i])){ out.push(hold[i]); hold.splice(i, 1); left--; }
  return out.sort((a, b) => a - b);
}
function botTurn(){
  busy = true;
  const s = SEATS[turn], c = cur();
  const pick = botPick(s.hold, c);
  if (pick && (!c || Math.random() < .82)){
    const used = takeFrom(s.hold, pick.num, pick.count);
    s.c = s.hold.length; lastPlayer = turn;
    trick.push({by: turn, num: pick.num, count: pick.count, cards: used});
  } else s.s = "pass";
  draw();
  setTimeout(advance, 620);
}

el("play").onclick = () => {
  const list = sel.map(i => hand[i]); if (!legal(list)) return;
  const e = effective(list);
  trick.push({by: 0, num: e, count: list.length, cards: list.slice().sort((a,b) => a-b)});
  hand = hand.filter((_, i) => !sel.includes(i));
  SEATS[0].hold = hand; SEATS[0].c = hand.length;
  sel = []; lastPlayer = 0; busy = true; draw();
  setTimeout(advance, 620);
};
function doPass(auto){
  if (turn !== 0 || busy) return;
  if (timerId) clearTimeout(timerId);
  sel = []; SEATS[0].s = "pass"; busy = true;
  if (auto) flash(T[lang].autoPass);
  draw(); setTimeout(advance, 500);
}
el("pass").onclick = () => doPass(false);

function flash(msg){
  const f = el("flash"); f.textContent = msg; f.style.opacity = 1;
  setTimeout(() => f.style.opacity = 0, 1200);
}

el("ring").addEventListener("click", e => {
  if (!trick.length) return;
  if (e.target.closest(".play, .spread")) { spread = !spread; renderPile(); }
});

document.querySelectorAll("#lang button").forEach(b => {
  b.addEventListener("click", () => {
    lang = b.dataset.l;
    document.documentElement.lang = lang;
    document.querySelectorAll("#lang button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    draw();
  });
});

draw(); resetTimer();
window.addEventListener("resize", draw);

})();

function go(id){
  document.querySelectorAll(".page").forEach(p => p.classList.remove("is-on"));
  document.getElementById(id).classList.add("is-on");
  window.scrollTo(0,0);
  /* 숨겨져 있는 동안은 폭이 0이라 손패 위치가 어긋난다. 보이는 순간 다시 그린다 */
  requestAnimationFrame(() => window.dispatchEvent(new Event("resize")));
  /* 방 설정(인원 등)을 그 화면에 반영한다 */
  if (id === "draw"  && window.__bootDraw)  window.__bootDraw();
  if (id === "table" && window.__bootTable) window.__bootTable();
  if (id === "tax"   && window.__bootTax)   window.__bootTax();
}
document.querySelector("#entry #start").addEventListener("click", () => go("lobby"));

/* 로비 → 대기실 */
["#lobby #btQuick", "#lobby #btNew", "#lobby #btJoin"].forEach(sel => {
  const b = document.querySelector(sel);
  if (b) b.addEventListener("click", () => go("room"));
});
/* 대기실 시작 → 세금·혁명 */
document.querySelector("#room #action").addEventListener("click", e => {
  const b = e.target.closest(".btn-primary");
  if (!b || b.disabled) return;
  go("draw");                     /* 첫 판은 뽑기부터 */
});
/* 뽑기 완료 → 1판 시작 (첫 판은 세금 없음) */
document.querySelector("#draw #go").addEventListener("click", e => {
  if (!e.currentTarget.disabled) go("table");
});
/* 판이 끝나면 계급·세금 화면으로. 세금을 끈 방은 건너뛴다 */
document.querySelector("#table #endRound").addEventListener("click", () => {
  go((window.__opts && window.__opts.tax === false) ? "draw" : "tax");
});
/* 세금·혁명의 마지막 "판 시작" → 테이블 */
document.querySelector("#tax #next").addEventListener("click", e => {
  const label = e.currentTarget.textContent.trim();
  if (label === "판 시작" || label === "Start round"){
    window.__roundNo = (window.__roundNo || 1) + 1;
    setTimeout(() => go("table"), 120);
  }
}, true);
/* 뒤로가기 */
document.querySelectorAll("[data-back]").forEach(b =>
  b.addEventListener("click", () => go(b.dataset.back)));

</script>
</body>
